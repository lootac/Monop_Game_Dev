/* =====================================================================
   Spreadsheet view of the books — a live "workbook" companion window and
   a real .xlsx export. Seven sheets that let you trace one number from the
   Journal through the Ledger and Trial Balance into the statements.
   Reuses books, ACCOUNTS, computeStatements, periodLabel, m$ from the
   accounting module.
   ===================================================================== */

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function normalSide(type) { return (type === 'asset' || type === 'expense') ? 'Debit' : 'Credit'; }

// Plain-English reason each line is a debit or a credit — the teaching aid.
function lineReason(acct, isDebit, closing) {
  const t = ACCOUNTS[acct].type;
  if (closing) {
    if (t === 'revenue') return 'closing income into Retained Earnings';
    if (t === 'expense') return 'closing expense into Retained Earnings';
    if (acct === 'retained') return isDebit ? "the year's loss lowers equity" : "the year's profit raises equity";
  }
  if (acct === 'gain') return 'a gain was realized (credit)';
  if (acct === 'loss') return 'a loss was realized (debit)';
  switch (t) {
    case 'asset': return isDebit ? 'an asset went up (debit)' : 'an asset went down (credit)';
    case 'liability': return isDebit ? 'a liability went down (debit)' : 'a liability went up (credit)';
    case 'equity': return isDebit ? 'equity went down (debit)' : 'equity went up (credit)';
    case 'revenue': return isDebit ? 'income reversed (debit)' : 'income earned (credit)';
    case 'expense': return isDebit ? 'an expense was incurred (debit)' : 'an expense reversed (credit)';
  }
  return '';
}

/* ---- Sheet builders: each returns { name, aoa } (array-of-arrays) ---- */

function sheetChart() {
  const rows = [['#', 'Account', 'Type', 'Normal balance']];
  Object.keys(ACCOUNTS).forEach((k) => {
    const a = ACCOUNTS[k];
    rows.push([a.code, a.name, cap(a.type), normalSide(a.type)]);
  });
  return { name: 'Chart of Accounts', aoa: rows };
}

function sheetJournal() {
  const rows = [['Entry #', 'Period', 'Event', 'Account', 'Debit', 'Credit', 'Why this side']];
  books.entries.forEach((e) => {
    const ordered = e.lines.filter((l) => l.dr > 0).concat(e.lines.filter((l) => l.cr > 0));
    let td = 0, tc = 0;
    ordered.forEach((l, idx) => {
      const isDr = l.dr > 0;
      rows.push([
        idx === 0 ? String(e.n) : '',
        idx === 0 ? e.period.label : '',
        idx === 0 ? e.desc + (e.closing ? '  (year-end close)' : '') : '',
        ACCOUNTS[l.acct].name,
        isDr ? l.dr : '',
        isDr ? '' : l.cr,
        lineReason(l.acct, isDr, e.closing),
      ]);
      td += l.dr; tc += l.cr;
    });
    rows.push(['', '', '', 'balances \u2192', td, tc, td === tc ? 'debits = credits \u2713' : 'OUT OF BALANCE']);
    rows.push(['', '', '', '', '', '', '']);
  });
  if (books.entries.length === 0) rows.push(['', '', 'No entries yet.', '', '', '', '']);
  return { name: 'Journal', aoa: rows };
}

function sheetLedger() {
  const perAcct = {}; Object.keys(ACCOUNTS).forEach((k) => { perAcct[k] = []; });
  const run = {}; Object.keys(ACCOUNTS).forEach((k) => { run[k] = 0; });
  books.entries.forEach((e) => {
    e.lines.forEach((l) => {
      run[l.acct] += (l.dr || 0) - (l.cr || 0);
      const type = ACCOUNTS[l.acct].type;
      const normalDebit = (type === 'asset' || type === 'expense');
      const shown = normalDebit ? run[l.acct] : -run[l.acct];
      perAcct[l.acct].push([String(e.n), e.period.label, e.desc, l.dr || '', l.cr || '', shown]);
    });
  });
  const rows = [];
  ['asset', 'liability', 'equity', 'revenue', 'expense'].forEach((tp) => {
    Object.keys(ACCOUNTS).filter((k) => ACCOUNTS[k].type === tp && perAcct[k].length).forEach((k) => {
      const a = ACCOUNTS[k];
      rows.push([`\u2500 ${a.name}  (${cap(tp)}, normal ${normalSide(tp)}) \u2500`, '', '', '', '', '']);
      rows.push(['Entry #', 'Period', 'Event', 'Debit', 'Credit', 'Running balance']);
      perAcct[k].forEach((r) => rows.push(r));
      rows.push(['', '', '', '', '', '']);
    });
  });
  if (!rows.length) rows.push(['No ledger activity yet.', '', '', '', '', '']);
  return { name: 'Ledger', aoa: rows };
}

function sheetTrialBalance() {
  const rows = [['#', 'Account', 'Debit', 'Credit']];
  let td = 0, tc = 0;
  Object.keys(ACCOUNTS).forEach((k) => {
    const bal = books.bal[k];
    if (Math.abs(bal) < 1e-9) return;
    const a = ACCOUNTS[k];
    if (bal > 0) { rows.push([a.code, a.name, bal, '']); td += bal; }
    else { rows.push([a.code, a.name, '', -bal]); tc += -bal; }
  });
  rows.push(['', 'TOTAL', td, tc]);
  rows.push(['', td === tc ? 'In balance \u2713  (debits = credits)' : 'OUT OF BALANCE', '', '']);
  return { name: 'Trial Balance', aoa: rows };
}

function sheetBalanceSheet() {
  const s = computeStatements(books.month);
  const le = s.liabilities + s.capital + s.retained + s.netIncome;
  return {
    name: 'Balance Sheet',
    aoa: [
      [`Balance Sheet \u2014 as of ${periodLabel(books.month).label}`, ''],
      ['ASSETS', ''],
      ['Cash', s.assets.cash],
      ['Real Estate \u2014 at cost', s.assets.realEstate],
      ['Improvements \u2014 at cost', s.assets.improvements],
      ['Total Assets', s.totalAssets],
      ['', ''],
      ['LIABILITIES', ''],
      ['Mortgages Payable', s.liabilities],
      ['', ''],
      ['EQUITY', ''],
      ["Owner's Capital", s.capital],
      ['Retained Earnings', s.retained],
      ['Current-Year Earnings', s.netIncome],
      ['Total Liabilities + Equity', le],
      ['', ''],
      ['Check: Assets \u2212 (Liab + Equity)', s.totalAssets - le],
    ],
  };
}

function sheetPL() {
  const s = computeStatements(books.month);
  const rows = [[`Profit & Loss \u2014 Year ${s.year} to date`, ''], ['REVENUE', '']];
  const rk = Object.keys(s.rev);
  if (rk.length) rk.forEach((k) => rows.push([ACCOUNTS[k].name, s.rev[k]])); else rows.push(['(none yet)', 0]);
  rows.push(['Total Revenue', s.revTotal]);
  rows.push(['', '']); rows.push(['EXPENSES', '']);
  const ek = Object.keys(s.exp);
  if (ek.length) ek.forEach((k) => rows.push([ACCOUNTS[k].name, s.exp[k]])); else rows.push(['(none yet)', 0]);
  rows.push(['Total Expenses', s.expTotal]);
  rows.push(['', '']);
  rows.push(['NET INCOME', s.netIncome]);
  return { name: 'Profit & Loss', aoa: rows };
}

function sheetCashFlow() {
  const s = computeStatements(books.month);
  const chk = s.beginCash + s.flow.Operating + s.flow.Investing + s.flow.Financing - s.endCash;
  return {
    name: 'Cash Flow',
    aoa: [
      [`Cash Flow \u2014 Year ${s.year} to date`, ''],
      ['Beginning cash', s.beginCash],
      ['Operating activities', s.flow.Operating],
      ['Investing activities', s.flow.Investing],
      ['Financing activities', s.flow.Financing],
      ['Ending cash', s.endCash],
      ['', ''],
      ['Check: begin + flows \u2212 end', chk],
    ],
  };
}

function buildSheets() {
  return [sheetChart(), sheetJournal(), sheetLedger(), sheetTrialBalance(), sheetBalanceSheet(), sheetPL(), sheetCashFlow()];
}

function cellIsMoney(sheetName, colIdx, headerRow) {
  // Money columns are those whose header is Debit/Credit/Balance, or the 2nd
  // column of the statement sheets. We format numbers there as currency.
  const h = (headerRow[colIdx] || '').toString().toLowerCase();
  if (h.includes('debit') || h.includes('credit') || h.includes('balance')) return true;
  return false;
}

function aoaToTableHtml(sheet) {
  const aoa = sheet.aoa;
  if (!aoa.length) return '';
  const header = aoa[0];
  const whyCol = header.indexOf('Why this side');
  let html = '<table class="bk">';
  aoa.forEach((row, ri) => {
    if (ri === 0) {
      html += '<tr>' + row.map((c) => `<th>${esc(c)}</th>`).join('') + '</tr>';
      return;
    }
    const first = (row[0] || '').toString();
    const isSub = row[0] === 'Entry #';                 // interior header inside Ledger
    const isTitle = /^[\u2500A-Z][A-Z \u2500&]*$/.test(first) && row.slice(1).every((c) => c === '' || c == null)
      || /^(Total|TOTAL|NET|Net|Check|Balance Sheet|Profit|Cash Flow|balances|In balance|OUT OF)/.test(first)
      || first.startsWith('\u2500');
    const cls = isSub ? ' class="sub"' : (isTitle ? ' class="strong"' : '');
    html += `<tr${cls}>`;
    row.forEach((c, ci) => {
      if (typeof c === 'number' && isFinite(c)) {
        html += `<td class="num">${m$(c)}</td>`;
      } else {
        const wc = (ci === whyCol && whyCol >= 0) ? ' class="why"' : '';
        html += `<td${wc}>${esc(c)}</td>`;
      }
    });
    html += '</tr>';
  });
  html += '</table>';
  return html;
}

function esc(s) {
  return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---- Real .xlsx export (dependency-free: hand-built OOXML + store-zip) ---- */

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const u16 = (n) => [n & 0xFF, (n >> 8) & 0xFF];
  const u32 = (n) => [n & 0xFF, (n >> 8) & 0xFF, (n >> 16) & 0xFF, (n >> 24) & 0xFF];
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  files.forEach((f) => {
    const nameBytes = enc.encode(f.name);
    const crc = crc32(f.data);
    const size = f.data.length;
    const local = [].concat(u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0));
    parts.push(new Uint8Array(local), nameBytes, f.data);
    const cen = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0), u32(crc), u32(size), u32(size), u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset));
    central.push(new Uint8Array(cen), nameBytes);
    offset += local.length + nameBytes.length + size;
  });
  const centralStart = offset;
  let centralSize = 0;
  central.forEach((c) => { centralSize += c.length; });
  const end = [].concat(u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length), u32(centralSize), u32(centralStart), u16(0));
  const all = parts.concat(central).concat([new Uint8Array(end)]);
  const total = all.reduce((s, a) => s + a.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach((a) => { out.set(a, p); p += a.length; });
  return out;
}
function colLetter(n) { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function xesc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function sheetXml(aoa) {
  let body = '';
  aoa.forEach((row, ri) => {
    let cells = '';
    row.forEach((cell, ci) => {
      if (cell === '' || cell == null) return;
      const ref = colLetter(ci) + (ri + 1);
      if (typeof cell === 'number' && isFinite(cell)) cells += `<c r="${ref}"><v>${cell}</v></c>`;
      else cells += `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(cell)}</t></is></c>`;
    });
    body += `<row r="${ri + 1}">${cells}</row>`;
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function sheetsToXlsxBlob(sheets) {
  const enc = new TextEncoder();
  const files = [];
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  files.push({ name: '[Content_Types].xml', data: enc.encode(ct) });
  files.push({ name: '_rels/.rels', data: enc.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`) });
  const wb = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xesc(s.name).slice(0, 31)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  files.push({ name: 'xl/workbook.xml', data: enc.encode(wb) });
  const wbr = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}</Relationships>`;
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: enc.encode(wbr) });
  sheets.forEach((s, i) => { files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: enc.encode(sheetXml(s.aoa)) }); });
  return new Blob([zipStore(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function downloadBooksXlsx() {
  const blob = sheetsToXlsxBlob(buildSheets());
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `monopoly-books-${periodLabel(books.month).label}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* =====================================================================
   Game Advisor — a side panel that sends the exact game state to Claude
   and returns turn-by-turn coaching. The player supplies their own
   Anthropic API key; it is kept in this browser only and sent directly
   to api.anthropic.com (browser-direct access).
   ===================================================================== */

const ADVISOR_MODELS = [
  { id: 'claude-sonnet-5', label: 'Sonnet 5 — balanced (recommended)' },
  { id: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5 — fastest / cheapest' },
  { id: 'claude-opus-4-8', label: 'Opus 4.8 — deepest strategy' },
];

function lsGet(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* file:// or blocked — memory only */ } }

const advisor = {
  key: lsGet('monopoly_advisor_key'),
  model: lsGet('monopoly_advisor_model') || 'claude-sonnet-5',
  busy: false,
  output: '',
  error: false,
};
let advisorPanelOpen = false;

const ADVISOR_SYSTEM =
  "You are a sharp, friendly Monopoly strategy coach. You advise the human player — referred to as \"You\" — in a 4-player game against three AI opponents. " +
  "Standard US Monopoly rules apply: declined purchases go to auction, houses must be built evenly across a color group, a full unmortgaged color set doubles bare-lot rent, mortgages are worth half the price, and a player who goes bankrupt to another player hands that creditor their whole estate. " +
  "Give concise, concrete, prioritized advice for the current turn: lead with the single most important move, then a few supporting notes (what to buy or pass, when to build, which trades to chase or accept/decline, mortgage and cash management, jail strategy, and which monopolies to target given opponents' cash and holdings). " +
  "Be direct and practical. Keep it under about 180 words unless the player asks for more depth. Don't restate the whole board — the player can see it.";

function advisorGameStateText() {
  const L = [];
  L.push(`Period: ${periodLabel(books.month || 1).label} (one "round" = every player rolls once). It is YOUR turn.`);
  players.forEach((p) => {
    if (p.bankrupt) { L.push(`- ${p.name}: BANKRUPT (out of the game).`); return; }
    const props = ownedIndicesGrouped(p.id).map((i) => {
      const s = BOARD[i]; const st = state.props[i];
      const key = s.type === 'property' ? s.color : s.type;
      const extra = [];
      if (st.houses === 5) extra.push('HOTEL');
      else if (st.houses > 0) extra.push(st.houses + (st.houses > 1 ? ' houses' : ' house'));
      if (st.mortgaged) extra.push('mortgaged');
      return `${s.name} [${key}${extra.length ? ', ' + extra.join(', ') : ''}]`;
    });
    L.push(`- ${p.name}${p.id === 0 ? ' (YOU)' : ''}: $${p.cash}, ${props.length} properties: ${props.join('; ') || 'none'}` + (p.goojCards ? `; ${p.goojCards} Get-Out-of-Jail card(s)` : ''));
  });
  const monos = [];
  for (const color in COLOR_GROUPS) {
    const idxs = COLOR_GROUPS[color];
    const owners = idxs.map((i) => state.props[i].owner);
    const uniq = [...new Set(owners)];
    if (uniq.length === 1 && uniq[0] !== null) monos.push(`${color} → ${players[uniq[0]].name}`);
    else {
      // near-miss: someone owns all but one
      owners.forEach((o, n) => {});
      const counts = {};
      owners.forEach((o) => { if (o !== null) counts[o] = (counts[o] || 0) + 1; });
      for (const o in counts) if (counts[o] === idxs.length - 1) monos.push(`${color}: ${players[o].name} needs 1 more`);
    }
  }
  if (monos.length) L.push('Color groups: ' + monos.join(' | '));
  const unowned = [];
  for (let i = 0; i < 40; i++) {
    const s = BOARD[i];
    if ((s.type === 'property' || s.type === 'railroad' || s.type === 'utility') && state.props[i].owner === null) unowned.push(s.name);
  }
  L.push('Still unowned / buyable: ' + (unowned.join(', ') || 'none — all sold'));
  const you = players[0];
  L.push(`Your token is on ${BOARD[you.position].name}.` + (you.inJail ? ` You are IN JAIL (attempt ${you.jailTurns + 1}/3).` : ''));
  const logEl = document.getElementById('log');
  if (logEl && logEl.children.length) {
    const recent = [...logEl.children].slice(-10).map((d) => d.textContent).filter(Boolean);
    if (recent.length) L.push('Recent events:\n' + recent.map((t) => '  • ' + t).join('\n'));
  }
  return L.join('\n');
}

async function callAdvisor(userMsg) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': advisor.key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: advisor.model,
      max_tokens: 800,
      system: ADVISOR_SYSTEM,
      messages: [{ role: 'user', content: userMsg }],
    }),
  });
  let data;
  try { data = await res.json(); } catch (e) { throw new Error(`Could not read the response (HTTP ${res.status}).`); }
  if (!res.ok) {
    const m = data && data.error && data.error.message ? data.error.message : `HTTP ${res.status}`;
    throw new Error(m);
  }
  const text = (data.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n').trim();
  return text || '(No advice came back — try again.)';
}

async function runAdvisor(question) {
  if (advisor.busy) return;
  const state_ = advisorGameStateText();
  const userMsg = (question ? question.trim() + '\n\n' : 'Coach my turn.\n\n') + 'Current game state:\n' + state_;
  advisor.busy = true; advisor.error = false; advisor.output = ''; renderAdvisorModal();
  try {
    advisor.output = await callAdvisor(userMsg);
    advisor.error = false;
  } catch (e) {
    advisor.error = true;
    let msg = e && e.message ? e.message : String(e);
    if (/failed to fetch|networkerror|load failed/i.test(msg)) {
      msg = 'Could not reach the API (network or CORS). If you opened the game as a local file, try running it through the local server (localhost) instead — some browsers block cross-origin calls from file:// pages.';
    }
    advisor.output = msg;
  }
  advisor.busy = false; renderAdvisorModal();
}

function advisorFormat(text) {
  const escd = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escd.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function openAdvisorModal() {
  advisorPanelOpen = true;
  advisor.output = advisor.output || '';
  renderAdvisorModal();
  showModal();
}
function closeAdvisor() { advisorPanelOpen = false; hideModal(); }

function renderAdvisorModal() {
  const modalEl = document.getElementById('modal');
  modalEl.classList.add('advisor-mode');
  modalTitle.textContent = 'Game Advisor';

  const modelSelect = `<select id="adv-model">${ADVISOR_MODELS.map((m) => `<option value="${m.id}" ${m.id === advisor.model ? 'selected' : ''}>${m.label}</option>`).join('')}</select>`;

  let body;
  if (!advisor.key) {
    body = `<div class="adv-intro">Paste an Anthropic API key to turn on coaching. The key is stored only in this browser and sent directly to <b>api.anthropic.com</b> — nothing goes through the game's author. You can create a key at <b>console.anthropic.com</b>.</div>
      <label class="adv-label">Anthropic API key</label>
      <input id="adv-key" type="password" placeholder="sk-ant-..." autocomplete="off" spellcheck="false" />
      <label class="adv-label">Model</label>
      ${modelSelect}
      <div class="adv-btnrow"><button id="adv-save" class="adv-primary">Save key & enable</button></div>`;
  } else {
    const out = advisor.busy
      ? '<div class="adv-thinking">Thinking through your position…</div>'
      : (advisor.output
        ? `<div class="adv-output ${advisor.error ? 'err' : ''}">${advisorFormat(advisor.output)}</div>`
        : '<div class="adv-hint">Click “Coach my turn” for advice on your current position, or ask a specific question below.</div>');
    body = `<div class="adv-toprow">${modelSelect}<button id="adv-changekey" class="adv-link">change key</button></div>
      <div class="adv-btnrow"><button id="adv-coach" class="adv-primary" ${advisor.busy ? 'disabled' : ''}>🧠 Coach my turn</button></div>
      ${out}
      <div class="adv-ask"><input id="adv-q" type="text" placeholder="Ask something specific — e.g. should I accept Cleo's trade?" ${advisor.busy ? 'disabled' : ''} />
      <button id="adv-send" class="adv-secondary" ${advisor.busy ? 'disabled' : ''}>Ask</button></div>`;
  }
  modalBody.innerHTML = body;

  const sel = modalBody.querySelector('#adv-model');
  if (sel) sel.onchange = () => { advisor.model = sel.value; lsSet('monopoly_advisor_model', advisor.model); };

  const saveBtn = modalBody.querySelector('#adv-save');
  if (saveBtn) saveBtn.onclick = () => {
    const v = (modalBody.querySelector('#adv-key').value || '').trim();
    if (!v) return;
    advisor.key = v; lsSet('monopoly_advisor_key', v);
    advisor.output = ''; renderAdvisorModal();
  };
  const changeKey = modalBody.querySelector('#adv-changekey');
  if (changeKey) changeKey.onclick = () => { advisor.key = ''; lsSet('monopoly_advisor_key', ''); advisor.output = ''; renderAdvisorModal(); };

  const coach = modalBody.querySelector('#adv-coach');
  if (coach) coach.onclick = () => runAdvisor('');
  const sendBtn = modalBody.querySelector('#adv-send');
  const q = modalBody.querySelector('#adv-q');
  if (sendBtn && q) {
    const go = () => { const t = q.value.trim(); if (t) runAdvisor(t); };
    sendBtn.onclick = go;
    q.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  modalActions.innerHTML = '';
  modalActions.appendChild(mkBtn('Close', () => { modalEl.classList.remove('advisor-mode'); closeAdvisor(); }));
}

/* ---------------------------------------------------------------------
   Init
--------------------------------------------------------------------- */

function init() {
  buildBoard();
  renderAll();
  log('Welcome to Monopoly! You are playing against Ava, Ben, and Cleo.', 'you');

  rollBtn.addEventListener('click', () => {
    if (pendingRollResolve) {
      const resolve = pendingRollResolve;
      pendingRollResolve = null;
      resolve();
    }
  });
  endTurnBtn.addEventListener('click', () => {
    if (pendingEndTurnResolve) {
      const resolve = pendingEndTurnResolve;
      pendingEndTurnResolve = null;
      resolve();
    }
  });
  manageBtn.addEventListener('click', async () => {
    if (state.currentIndex !== 0 || state.gameOver) return;
    await showManagePropertiesModal(players[0]);
  });
  booksBtn.addEventListener('click', () => {
    if (state.gameOver || players[0].bankrupt) return;
    openBooksModal();
  });
  advisorBtn.addEventListener('click', () => {
    if (state.gameOver || players[0].bankrupt || state.currentIndex !== 0) return;
    openAdvisorModal();
  });
  tradeBtn.addEventListener('click', async () => {
    if (state.currentIndex !== 0 || state.gameOver) return;
    const candidates = players.filter((p) => p.id !== 0 && !p.bankrupt);
    if (candidates.length === 0) return;
    const targetId = await askModal(
      'Propose Trade',
      'Choose a player to trade with:',
      candidates.map((p) => ({ label: p.name, value: p.id }))
    );
    const offer = await openTradeBuilder(players[0], players[targetId]);
    if (offer) await proposeAndNegotiate(offer);
    renderAll();
  });

  rollBtn.disabled = true;
  endTurnBtn.disabled = true;
  manageBtn.disabled = true;
  tradeBtn.disabled = true;
  booksBtn.disabled = true;
  advisorBtn.disabled = true;

  playTurn(players[0]);
}

init();
