<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monopoly — vs AI</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #0e1420;
  color: #eaeef2;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

#app {
  display: flex;
  gap: 16px;
  padding: 16px;
  align-items: flex-start;
  justify-content: center;
  flex-wrap: wrap;
}

/* ---------- Board ---------- */
#board-wrap { flex: 0 0 auto; }

#board {
  display: grid;
  grid-template-columns: 1.613fr repeat(9, 1fr) 1.613fr;
  grid-template-rows: 1.613fr repeat(9, 1fr) 1.613fr;
  width: min(758px, 92vw);
  aspect-ratio: 1 / 1;
  background: #14532d;
  border: 3px solid #333;
  position: relative;
  container-type: inline-size;
}

.cell {
  border: 1px solid #444;
  background: #1b2333;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  font-size: clamp(5px, 1.05cqw, 8px);
  line-height: 1.15;
}

.cell.corner {
  font-size: clamp(6px, 1.3cqw, 10px);
  align-items: center;
  justify-content: center;
  text-align: center;
  font-weight: 700;
  background: #202a3d;
}

.cell .colorbar {
  height: clamp(7px, 1.55cqw, 12px);
  width: 100%;
  flex: 0 0 auto;
}

.cell .name {
  padding: 2px 3px;
  font-weight: 600;
  flex: 1;
  display: flex;
  align-items: center;
  text-align: center;
  justify-content: center;
  color: #dfe6ee;
}

.cell .price {
  padding: 1px 3px 3px;
  text-align: center;
  color: #9fb0c3;
  font-size: clamp(5px, 0.99cqw, 7.5px);
}

.cell .owner-strip {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
}

.cell .houses {
  position: absolute;
  top: clamp(8px, 1.7cqw, 13px);
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 1px;
}
.cell .houses .h { width: clamp(4px, 0.8cqw, 6px); height: clamp(4px, 0.8cqw, 6px); background: #2ecc71; border-radius: 1px; }
.cell .houses .hotel { width: clamp(7px, 1.3cqw, 10px); height: clamp(5px, 1.05cqw, 8px); background: #e74c3c; border-radius: 1px; }

.tokens {
  position: absolute;
  bottom: 2px;
  left: 2px;
  right: 2px;
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  justify-content: center;
}
.token {
  width: clamp(7px, 1.45cqw, 11px); height: clamp(7px, 1.45cqw, 11px);
  border-radius: 50%;
  border: 1.5px solid #0e1420;
  flex: 0 0 auto;
}

.cell.mortgaged { opacity: 0.55; }
.cell.mortgaged .name::after { content: " (M)"; color: #e74c3c; }

/* ---------- Sidebar ---------- */
#sidebar {
  flex: 0 0 auto;
  width: min(360px, 92vw);
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#players {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.player-card {
  background: #1b2333;
  border: 1px solid #2c3750;
  border-radius: 8px;
  padding: 8px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.player-card.active {
  border-color: #ffd54f;
  box-shadow: 0 0 0 2px rgba(255,213,79,0.35);
}
.player-card.bankrupt { opacity: 0.4; }

.player-dot {
  width: 16px; height: 16px; border-radius: 50%;
  flex: 0 0 auto;
  border: 2px solid #0e1420;
}

.player-info { flex: 1; }
.player-name { font-weight: 700; font-size: 13px; }
.player-cash { font-size: 12px; color: #9fb0c3; }
.player-jail { font-size: 11px; color: #ff8a65; }
.player-props { font-size: 10.5px; color: #7f93ac; margin-top: 2px; }

#controls {
  background: #1b2333;
  border: 1px solid #2c3750;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#dice-area {
  display: flex;
  align-items: center;
  gap: 12px;
}

#dice { display: flex; gap: 6px; }
.die {
  width: 34px; height: 34px;
  background: #fff;
  color: #111;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800;
  font-size: 16px;
}

button {
  background: #2c6bed;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { background: #3a4256; color: #7a8598; cursor: not-allowed; }
button.secondary { background: #3a4256; }
button.danger { background: #c0392b; }

#action-area {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#action-area .action-row { display: flex; gap: 8px; flex-wrap: wrap; }

#log {
  flex: 0 0 auto;
  width: min(360px, 92vw);
  height: min(764px, 80vh);
  background: #1b2333;
  border: 1px solid #2c3750;
  border-radius: 8px;
  padding: 12px;
  overflow-y: auto;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
#log .entry { color: #b7c2d0; }
#log .entry.you { color: #ffe082; }
#log .entry.event { color: #80cbc4; }

/* ---------- Modal ---------- */
#modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 50;
}
#modal-backdrop.hidden { display: none; }
#modal {
  background: #1b2333;
  border: 1px solid #2c3750;
  border-radius: 10px;
  padding: 18px 20px;
  width: 420px;
  max-width: 90vw;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
}
#modal-title { font-weight: 800; font-size: 15px; margin-bottom: 8px; }
#modal-body { font-size: 13px; color: #c6d0dc; margin-bottom: 14px; line-height: 1.5; overflow-y: auto; }
#modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Responsive: phones / narrow windows ---------- */
@media (max-width: 780px) {
  #app { padding: 8px; gap: 10px; }
  #board { width: min(758px, 96vw); }
  #sidebar, #log { width: min(560px, 96vw); }
  #log { height: 42vh; }
}


/* ===== Books panel (double-entry accounting) ===== */
#modal.books-mode { width: min(680px, 94vw); }
.books-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
.books-tabs button { background: #3a4256; }
.books-tabs button.active { background: #2c6bed; }
.books-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 6px; }
.books-table td, .books-table th { padding: 3px 6px; border-bottom: 1px solid #2c3750; text-align: left; }
.books-table td.num, .books-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.books-je { margin-bottom: 8px; }
.books-je .je-head { color: #9fb0c3; font-size: 11px; margin-bottom: 2px; }
.books-je .je-line { display: flex; justify-content: space-between; }
.books-je .je-line .cr { padding-left: 20px; color: #80cbc4; }
.books-je .je-line .dr { color: #ffe082; }
.books-section-title { font-weight: 700; margin: 10px 0 4px; color: #dfe6ee; }
#books-toasts { position: fixed; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: 300px; }
.books-toast { background: #12321f; border: 1px solid #1f6f47; border-radius: 8px; padding: 8px 10px; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); transition: opacity .5s; }
.books-toast .bt-desc { font-weight: 700; margin-bottom: 3px; color: #8fe3b0; }
.books-toast .bt-lines { color: #c6d0dc; line-height: 1.5; }
.books-toast.fade { opacity: 0; }

/* ===== T-accounts (Ledger tab) ===== */
.tacct { margin: 0 0 14px; border: 1px solid #2c3750; border-radius: 8px; overflow: hidden; background: #0e1420; }
.tacct-name { text-align: center; font-weight: 700; padding: 6px 8px; background: #1b2436; border-bottom: 2px solid #3a4256; }
.tacct-meta { font-weight: 400; color: #9fb0c3; font-size: 11px; margin-left: 8px; }
.tacct-grid { display: grid; grid-template-columns: 1fr 1fr; }
.tacct-side { padding: 6px 10px 8px; min-width: 0; }
.tacct-side.right { border-left: 2px solid #3a4256; }
.tacct-h { text-align: center; font-size: 11px; letter-spacing: .04em; color: #9fb0c3; margin-bottom: 5px; }
.tacct-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 1px 0; }
.tacct-row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cdd6e0; }
.tacct-row .amt { font-variant-numeric: tabular-nums; color: #eaeef2; }
.tacct-row.empty { color: #5c6c7e; justify-content: center; }
.tacct-total { display: flex; justify-content: space-between; gap: 10px; margin-top: 5px; padding-top: 3px; border-top: 1px solid #2c3750; font-weight: 700; font-size: 12px; }
.tacct-total .amt { font-variant-numeric: tabular-nums; }
.tacct-bal { padding: 5px 12px; background: #12321f; color: #8fe3b0; font-weight: 700; font-size: 12.5px; border-top: 1px solid #1f6f47; }
.tacct-bal.debit { text-align: left; }
.tacct-bal.credit { text-align: right; }

/* ===== Game Advisor panel ===== */
#modal.advisor-mode { width: min(560px, 94vw); }
.adv-intro { font-size: 12.5px; color: #b9c4d0; line-height: 1.5; margin-bottom: 10px; }
.adv-label { display: block; font-size: 11px; color: #9fb0c3; margin: 8px 0 3px; }
#adv-key, #adv-q, #adv-model { width: 100%; box-sizing: border-box; background: #0e1420; color: #eaeef2; border: 1px solid #2c3750; border-radius: 6px; padding: 7px 9px; font-size: 13px; }
#adv-model { cursor: pointer; }
.adv-toprow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.adv-toprow #adv-model { flex: 1; }
.adv-link { background: none; border: none; color: #7fa8e8; cursor: pointer; font-size: 11.5px; padding: 2px 4px; }
.adv-btnrow { margin: 10px 0; }
.adv-primary { width: 100%; background: #2c6bed; color: #fff; border: none; border-radius: 7px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.adv-primary:disabled { opacity: .5; cursor: default; }
.adv-secondary { background: #3a4256; color: #eaeef2; border: none; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
.adv-output { background: #10192b; border: 1px solid #24406e; border-radius: 8px; padding: 11px 13px; font-size: 13px; line-height: 1.55; color: #e4ebf3; white-space: pre-wrap; }
.adv-output.err { background: #2a1416; border-color: #6f1f24; color: #f2b8bd; }
.adv-thinking { color: #9fb0c3; font-style: italic; padding: 10px 2px; }
.adv-hint { color: #7f93ac; font-size: 12.5px; padding: 6px 2px; }
.adv-ask { display: flex; gap: 8px; margin-top: 12px; }
.adv-ask #adv-q { flex: 1; }

</style>
</head>
<body>
<div id="app">
  <div id="board-wrap">
    <div id="board"></div>
  </div>

  <div id="sidebar">
    <div id="players"></div>

    <div id="controls">
      <div id="dice-area">
        <div id="dice">
          <div class="die" id="die1">-</div>
          <div class="die" id="die2">-</div>
        </div>
        <button id="roll-btn">Roll Dice</button>
      </div>
      <div id="action-area"></div>
      <button id="manage-btn" class="secondary" disabled>Manage Properties</button>
      <button id="trade-btn" class="secondary" disabled>Propose Trade</button>
      <button id="books-btn" class="secondary" disabled>Open Books</button>
      <button id="advisor-btn" class="secondary" disabled>Ask Advisor</button>
      <button id="end-turn-btn" disabled>End Turn</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<div id="modal-backdrop" class="hidden">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

const AI_PROFILES = {

const TRADE_ROUND_CAP = 4;

function buildInitialProps() {
  return BOARD.map((space) => {
    if (space.type === 'property' || space.type === 'railroad' || space.type === 'utility') {
      return { owner: null, houses: 0, mortgaged: false };
    }
    return null;
  });
}

const state = {
  props: buildInitialProps(),
  currentIndex: -1,
  lastDiceSum: 0,
  gameOver: false,
  cellEls: {},
  bankHouses: 32,
  bankHotels: 12,
};

/* ---------------------------------------------------------------------
   Small utilities
--------------------------------------------------------------------- */

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function ownedIndicesOf(playerId) {
  const res = [];
  for (let i = 0; i < 40; i++) {
    if (state.props[i] && state.props[i].owner === playerId) res.push(i);
  }
  return res;
}

// Rank used to cluster a player's holdings by color group (board progression),
// with railroads and utilities gathered at the end, so same-color deeds sit
// adjacent in the readouts and monopolies stand out.
const DISPLAY_GROUP_ORDER = { brown: 0, lightblue: 1, pink: 2, orange: 3, red: 4, yellow: 5, green: 6, darkblue: 7, railroad: 8, utility: 9 };
function displayGroupRank(i) {
  const s = BOARD[i];
  const key = s.type === 'property' ? s.color : s.type;
  return DISPLAY_GROUP_ORDER[key] != null ? DISPLAY_GROUP_ORDER[key] : 99;
}
function ownedIndicesGrouped(playerId) {
  return ownedIndicesOf(playerId).slice().sort((a, b) => displayGroupRank(a) - displayGroupRank(b) || a - b);
}

function log(msg, cls) {
  const wasNearBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  const div = document.createElement('div');
  div.className = 'entry' + (cls ? ' ' + cls : '');
  div.textContent = msg;
  logEl.appendChild(div);
  while (logEl.children.length > 300) logEl.removeChild(logEl.firstChild);
  if (wasNearBottom) logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(text) { actionArea.textContent = text || ''; }

function mkBtn(label, onclick, disabled, cls) {
  const btn = document.createElement('button');
  btn.textContent = label;
  if (cls) btn.className = cls;
  if (disabled) btn.disabled = true;
  btn.onclick = onclick;
  return btn;
}

/* ---------------------------------------------------------------------
   Modal helpers
--------------------------------------------------------------------- */

function showModal() { modalBackdrop.classList.remove('hidden'); }
function hideModal() { modalBackdrop.classList.add('hidden'); }

function askModal(title, bodyHtml, buttons) {
  return new Promise((resolve) => {
    modalTitle.textContent = title;
    modalBody.innerHTML = bodyHtml;
    modalActions.innerHTML = '';
    buttons.forEach((b) => {
      const btn = mkBtn(b.label, () => { hideModal(); resolve(b.value); }, b.disabled, b.cls);
      modalActions.appendChild(btn);
    });
    showModal();
  });
}

function propertyRowLabel(i) {
  const space = BOARD[i];
  const st = state.props[i];
  let extra = '';
  if (st.mortgaged) extra += ' (mortgaged)';
  if (space.type === 'property' && st.houses > 0) extra += st.houses === 5 ? ' [Hotel]' : ` [${st.houses}h]`;
  return `${space.name}${extra}`;
}

      const list = document.createElement('div');

      list.style.flexDirection = 'column';
      list.style.gap = '6px';

        const none = document.createElement('div');
        none.textContent = 'No properties left to liquidate.';
        none.style.color = '#7f93ac';
        list.appendChild(none);
      }

      owned.forEach((i) => {
        const space = BOARD[i];
        const st = state.props[i];

        row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;';

/* ---------------------------------------------------------------------

function tradeablePropertiesOf(playerId) {
  return ownedIndicesOf(playerId).filter((i) => BOARD[i].type !== 'property' || state.props[i].houses === 0);
}

function buildTradeSideColumn(title, player, sel, onChange) {
  const col = document.createElement('div');
  col.style.marginBottom = '12px';

  const h = document.createElement('div');
  h.textContent = `${title} (cash: $${player.cash}, GOOJ cards: ${player.goojCards})`;
  h.style.cssText = 'font-weight:700;font-size:12px;margin-bottom:6px;';
  col.appendChild(h);

  const tradeable = tradeablePropertiesOf(player.id);
  if (tradeable.length === 0) {
    const none = document.createElement('div');
    none.textContent = 'No tradeable properties.';
    none.style.cssText = 'color:#7f93ac;font-size:11px;margin-bottom:4px;';
    col.appendChild(none);
  }
  tradeable.forEach((i) => {
    const space = BOARD[i];
    const row = document.createElement('label');
    row.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = sel.props.has(i);
    cb.onchange = () => { if (cb.checked) sel.props.add(i); else sel.props.delete(i); onChange(); };
    row.appendChild(cb);
    const span = document.createElement('span');
    span.textContent = propertyRowLabel(i);
    const colorKey = space.type === 'property' ? space.color : space.type;
    span.style.color = LEGEND_COLORS[colorKey] || '#c6d0dc';
    row.appendChild(span);
    col.appendChild(row);
  });

  const cashRow = document.createElement('div');
  cashRow.style.cssText = 'display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;';
  const cashLabel = document.createElement('span');
  cashLabel.textContent = 'Cash: $';
  const cashInput = document.createElement('input');
  cashInput.type = 'number';
  cashInput.min = 0;
  cashInput.max = player.cash;
  cashInput.value = sel.cash;
  cashInput.style.cssText = 'width:70px;background:#0e1420;color:#eaeef2;border:1px solid #2c3750;border-radius:4px;padding:2px 4px;';
  cashInput.oninput = () => { sel.cash = Math.max(0, Math.min(player.cash, Number(cashInput.value) || 0)); onChange(); };
  cashRow.appendChild(cashLabel);
  cashRow.appendChild(cashInput);
  col.appendChild(cashRow);

  if (player.goojCards > 0) {
    const cardRow = document.createElement('label');
    cardRow.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:12px;margin-top:4px;';
    const cardCb = document.createElement('input');
    cardCb.type = 'checkbox';
    cardCb.checked = sel.cards > 0;
    cardCb.onchange = () => { sel.cards = cardCb.checked ? 1 : 0; onChange(); };
    cardRow.appendChild(cardCb);
    const cardLabel = document.createElement('span');
    cardLabel.textContent = 'Get Out of Jail Free card';
    cardRow.appendChild(cardLabel);
    col.appendChild(cardRow);
  }

  return col;
}

function openTradeBuilder(proposer, counterpart, prefill) {
  return new Promise((resolve) => {
    const pg = (prefill && prefill.give) || {};
    const pt = (prefill && prefill.take) || {};
    const giveSel = { props: new Set(pg.props || []), cash: Math.min(proposer.cash, pg.cash || 0), cards: pg.cards || 0 };
    const takeSel = { props: new Set(pt.props || []), cash: Math.min(counterpart.cash, pt.cash || 0), cards: pt.cards || 0 };
    let sendBtn;
    function updateSendState() {
      const hasContent = giveSel.props.size || giveSel.cash || giveSel.cards
        || takeSel.props.size || takeSel.cash || takeSel.cards;
      sendBtn.disabled = !hasContent;
    }
    modalTitle.textContent = `Propose Trade: ${proposer.name} ⇄ ${counterpart.name}`;
    modalBody.innerHTML = '';
    modalBody.appendChild(buildTradeSideColumn(`${proposer.name} gives`, proposer, giveSel, updateSendState));
    modalBody.appendChild(buildTradeSideColumn(`${counterpart.name} gives`, counterpart, takeSel, updateSendState));
    modalActions.innerHTML = '';
    sendBtn = mkBtn('Send Offer', () => {
      hideModal();
      resolve({
        fromId: proposer.id,
        toId: counterpart.id,
        give: { props: [...giveSel.props], cash: giveSel.cash, cards: giveSel.cards },
        take: { props: [...takeSel.props], cash: takeSel.cash, cards: takeSel.cards },
      });
    }, true);
    modalActions.appendChild(sendBtn);
    modalActions.appendChild(mkBtn('Cancel', () => { hideModal(); resolve(null); }, false, 'secondary'));
    showModal();
  });
}

function describeTradeSide(side) {
  const parts = [];
  side.props.forEach((i) => parts.push(BOARD[i].name));
  if (side.cash) parts.push(`$${side.cash}`);
  if (side.cards) parts.push(`${side.cards} GOOJ card${side.cards > 1 ? 's' : ''}`);
  return parts.length ? parts.join(', ') : 'nothing';
}

function renderTradeThread(thread) {
  modalBody.innerHTML = '';
  thread.forEach((entry) => {
    const isYou = entry.by === 0;
    const bubble = document.createElement('div');
    bubble.style.cssText = `margin-bottom:8px;padding:8px 10px;border-radius:8px;font-size:12px;
      max-width:90%;background:${isYou ? 'rgba(44,107,237,0.25)' : 'rgba(58,66,86,0.6)'};
      margin-left:${isYou ? 'auto' : '0'};`;
    const name = document.createElement('div');
    name.style.cssText = 'font-weight:700;margin-bottom:3px;';
    name.textContent = players[entry.by].name;
    bubble.appendChild(name);
    const body = document.createElement('div');
    if (entry.offer) {
      body.innerHTML = `Offers: <b>${describeTradeSide(entry.offer.give)}</b><br>Wants: <b>${describeTradeSide(entry.offer.take)}</b>`;
    } else if (entry.type === 'accept') {
      body.textContent = 'Deal accepted!';
    } else if (entry.type === 'reject') {
      body.textContent = 'Rejected the offer.';
    } else if (entry.type === 'stalled') {
      body.textContent = 'Negotiations stalled (round limit reached).';
    }
    bubble.appendChild(body);
    modalBody.appendChild(bubble);
  });
  modalBody.scrollTop = modalBody.scrollHeight;
}

async function askHumanTradeDecision(thread, offer, round) {
  while (true) {
    const choice = await new Promise((resolve) => {
      modalTitle.textContent = 'Trade Proposal';
      renderTradeThread(thread);
      modalActions.innerHTML = '';
      modalActions.appendChild(mkBtn('Accept', () => resolve('accept')));
      modalActions.appendChild(mkBtn('Reject', () => resolve('reject'), false, 'danger'));
      modalActions.appendChild(mkBtn('Counter', () => resolve('counter'), round >= TRADE_ROUND_CAP, 'secondary'));
      showModal();
    });
    if (choice === 'counter') {
      const counter = await openTradeBuilder(players[offer.toId], players[offer.fromId], {
        give: { props: [...offer.take.props], cash: offer.take.cash, cards: offer.take.cards },
        take: { props: [...offer.give.props], cash: offer.give.cash, cards: offer.give.cards },
      });
      if (counter) return counter;
      continue;
    }
    return choice;
  }
}

/* ---------------------------------------------------------------------
   Rendering
--------------------------------------------------------------------- */

function cellPosition(i) {
  if (i === 0) return { row: 11, col: 11 };
  if (i >= 1 && i <= 9) return { row: 11, col: 11 - i };
  if (i === 10) return { row: 11, col: 1 };
  if (i >= 11 && i <= 19) return { row: 21 - i, col: 1 };
  if (i === 20) return { row: 1, col: 1 };
  if (i >= 21 && i <= 29) return { row: 1, col: i - 19 };
  if (i === 30) return { row: 1, col: 11 };
  return { row: i - 29, col: 11 }; // 31..39
}

function buildBoard() {
  BOARD.forEach((space) => {
    const { row, col } = cellPosition(space.i);
    const cell = document.createElement('div');
    cell.className = 'cell' + ([0, 10, 20, 30].includes(space.i) ? ' corner' : '');
    cell.style.gridRow = row;
    cell.style.gridColumn = col;

    if (space.type === 'property') {
      const bar = document.createElement('div');
      bar.className = 'colorbar';
      bar.style.background = COLORS[space.color];
      cell.appendChild(bar);
    } else if (space.type === 'railroad' || space.type === 'utility') {
      const bar = document.createElement('div');
      bar.className = 'colorbar';
      bar.style.background = COLORS[space.type];
      cell.appendChild(bar);
    }

    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = space.name;
    cell.appendChild(nameEl);

    if (space.price) {
      const priceEl = document.createElement('div');
      priceEl.className = 'price';
      priceEl.textContent = '$' + space.price;
      cell.appendChild(priceEl);
    }

    let housesEl = null;
    if (space.type === 'property') {
      housesEl = document.createElement('div');
      housesEl.className = 'houses';
      cell.appendChild(housesEl);
    }

    const ownerStrip = document.createElement('div');
    ownerStrip.className = 'owner-strip';
    cell.appendChild(ownerStrip);

    const tokens = document.createElement('div');
    tokens.className = 'tokens';
    cell.appendChild(tokens);

    boardEl.appendChild(cell);
    state.cellEls[space.i] = { cell, ownerStrip, tokens, houses: housesEl };
  });
}

function renderBoardOwnership() {
  for (let i = 0; i < 40; i++) {
    const st = state.props[i];
    if (!st) continue;
    const els = state.cellEls[i];
    els.ownerStrip.style.background = st.owner !== null ? PLAYER_COLORS[st.owner] : 'transparent';
    els.cell.classList.toggle('mortgaged', st.mortgaged);
    if (els.houses) {
      els.houses.innerHTML = '';
      if (st.houses === 5) {
        const h = document.createElement('div');
        h.className = 'hotel';
        els.houses.appendChild(h);
      } else {
        for (let n = 0; n < st.houses; n++) {
          const h = document.createElement('div');
          h.className = 'h';
          els.houses.appendChild(h);
        }
      }
    }
  }
}

function renderTokens() {
  for (let i = 0; i < 40; i++) state.cellEls[i].tokens.innerHTML = '';
  players.forEach((p) => {
    if (p.bankrupt) return;
    const tok = document.createElement('div');
    tok.className = 'token';
    tok.style.background = p.color;
    tok.title = p.name;
    state.cellEls[p.position].tokens.appendChild(tok);
  });
}

function renderPlayers() {
  playersEl.innerHTML = '';
  players.forEach((p) => {
    const card = document.createElement('div');
    card.className = 'player-card' + (p.id === state.currentIndex ? ' active' : '') + (p.bankrupt ? ' bankrupt' : '');
    const dot = document.createElement('div');
    dot.className = 'player-dot';
    dot.style.background = p.color;
    card.appendChild(dot);

    const info = document.createElement('div');
    info.className = 'player-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'player-name';
    nameEl.textContent = p.name + (p.bankrupt ? ' — bankrupt' : '');
    info.appendChild(nameEl);
    const cashEl = document.createElement('div');
    cashEl.className = 'player-cash';
    cashEl.textContent = `$${p.cash}`;
    info.appendChild(cashEl);
    if (p.inJail && !p.bankrupt) {
      const jailEl = document.createElement('div');
      jailEl.className = 'player-jail';
      jailEl.textContent = `In Jail (attempt ${p.jailTurns + 1}/3)`;
      info.appendChild(jailEl);
    }
    if (!p.bankrupt) {
      const owned = ownedIndicesGrouped(p.id);
      const propsEl = document.createElement('div');
      propsEl.className = 'player-props';
      if (owned.length === 0) {
        propsEl.textContent = 'No properties';
      } else {
        propsEl.appendChild(document.createTextNode(`${owned.length} properties: `));
        owned.forEach((i, idx) => {
          const space = BOARD[i];
          const nameSpan = document.createElement('span');
          nameSpan.textContent = space.name;
          const colorKey = space.type === 'property' ? space.color : space.type;
          nameSpan.style.color = LEGEND_COLORS[colorKey] || '#c6d0dc';
          propsEl.appendChild(nameSpan);
          if (idx < owned.length - 1) propsEl.appendChild(document.createTextNode(', '));
        });
      }
      info.appendChild(propsEl);
    }
    card.appendChild(info);
    playersEl.appendChild(card);
  });
}

function updateButtons() {
  const human = players[0];
  const notHumansTurn = state.gameOver || human.bankrupt || state.currentIndex !== 0;
  manageBtn.disabled = notHumansTurn;
  tradeBtn.disabled = notHumansTurn || players.filter((p) => p.id !== 0 && !p.bankrupt).length === 0;
  if (typeof booksBtn !== 'undefined' && booksBtn) booksBtn.disabled = state.gameOver || human.bankrupt;
  if (typeof advisorBtn !== 'undefined' && advisorBtn) advisorBtn.disabled = notHumansTurn;
}

function renderAll() {
  renderPlayers();
  renderTokens();
  renderBoardOwnership();
  updateButtons();
}

function showDiceFaces(d1, d2) {
  die1El.textContent = d1;
  die2El.textContent = d2;
}

/* ---------------------------------------------------------------------
   Movement & space resolution
--------------------------------------------------------------------- */

function movePlayerBySteps(player, steps) {
  const passed = player.position + steps >= 40;
  player.position = (player.position + steps) % 40;
  if (passed) {
    player.cash += 200;
    if (player.id === HUMAN_ID) bkGo();
    log(`${player.name} passed GO and collected $200.`, player.isHuman ? 'you' : '');
  }
}

function moveDirect(player, dest, opts) {
  const passGo = !opts || opts.passGo !== false;
  if (passGo && dest < player.position) {
    player.cash += 200;
    if (player.id === HUMAN_ID) bkGo();
    log(`${player.name} passed GO and collected $200.`, player.isHuman ? 'you' : '');
  }
  player.position = dest;
}

function sendToJail(player) {
  player.position = 10;
  player.inJail = true;
  player.jailTurns = 0;
  log(`${player.name} was sent to Jail.`, 'event');
}

function nearestOf(list, position) {
  const sorted = [...list].sort((a, b) => a - b);
  for (const x of sorted) if (x > position) return x;
  return sorted[0];
}

function computeRent(i, diceSum, utilityMultiplierOverride) {
  const space = BOARD[i];
  const st = state.props[i];
  if (space.type === 'property') {
    if (st.houses === 0) {
      const fullGroup = COLOR_GROUPS[space.color].every((j) => state.props[j].owner === st.owner);
      return fullGroup ? space.rent[0] * 2 : space.rent[0];
    }
    return space.rent[st.houses];
  }
  if (space.type === 'railroad') {
    const railroads = [5, 15, 25, 35];
    const count = railroads.filter((j) => state.props[j].owner === st.owner).length;
    return RAILROAD_RENT[count - 1];
  }
  if (space.type === 'utility') {
    if (utilityMultiplierOverride) return diceSum * utilityMultiplierOverride;
    const utils = [12, 28];
    const count = utils.filter((j) => state.props[j].owner === st.owner).length;
    return diceSum * (count === 2 ? 10 : 4);
  }
  return 0;
}

/* ---------------------------------------------------------------------
   Building (even-build rule + bank house/hotel supply)
--------------------------------------------------------------------- */

function ownsFullUnmortgagedGroup(playerId, color) {
  return COLOR_GROUPS[color].every((j) => state.props[j].owner === playerId && !state.props[j].mortgaged);
}

function canBuildHouseOn(i, playerId) {
  const space = BOARD[i];
  if (space.type !== 'property') return false;
  const st = state.props[i];
  if (st.owner !== playerId || st.mortgaged || st.houses >= 5) return false;
  if (!ownsFullUnmortgagedGroup(playerId, space.color)) return false;
  const minInGroup = Math.min(...COLOR_GROUPS[space.color].map((j) => state.props[j].houses));
  if (st.houses > minInGroup) return false; // must build evenly across the color group
  return st.houses < 4 ? state.bankHouses >= 1 : state.bankHotels >= 1;
}

function buildHouseOn(i, player) {
  const space = BOARD[i];
  const st = state.props[i];
  if (!canBuildHouseOn(i, player.id) || player.cash < space.houseCost) return false;
  player.cash -= space.houseCost;
  if (st.houses < 4) {
    state.bankHouses -= 1;
  } else {
    state.bankHotels -= 1;
    state.bankHouses += 4; // the 4 houses on the property return to the bank's pool
  }
  st.houses += 1;
  if (player.id === HUMAN_ID) bkBuild(i, space.houseCost, st.houses === 5);
  return true;
}

function canSellHouseOn(i, playerId) {
  const space = BOARD[i];
  const st = state.props[i];
  if (space.type !== 'property' || st.owner !== playerId || st.houses <= 0) return false;
  const maxInGroup = Math.max(...COLOR_GROUPS[space.color].map((j) => state.props[j].houses));
  if (st.houses < maxInGroup) return false; // must sell evenly, from the highest first
  if (st.houses === 5 && state.bankHouses < 4) return false; // not enough houses in the bank to break down the hotel
  return true;
}

function sellHouseOn(i, player) {
  const space = BOARD[i];
  const st = state.props[i];
  if (!canSellHouseOn(i, player.id)) return false;
  if (st.houses === 5) {
    state.bankHotels += 1;
    state.bankHouses -= 4;
  } else {
    state.bankHouses += 1;
  }
  st.houses -= 1;
  player.cash += space.houseCost / 2;
  if (player.id === HUMAN_ID) bkSellBuilding(i, space.houseCost);
  return true;
}

function liquidateBuildingsOn(i) {
  const space = BOARD[i];
  const st = state.props[i];
  if (space.type !== 'property' || st.houses <= 0) return 0;
  const refund = st.houses * (space.houseCost / 2);
  if (st.houses === 5) state.bankHotels += 1;
  else state.bankHouses += st.houses;
  st.houses = 0;
  return refund;
}

function computeNetWorth(player) {
  let worth = player.cash;
  ownedIndicesOf(player.id).forEach((i) => {
    const space = BOARD[i];
    const st = state.props[i];
    worth += st.mortgaged ? space.price / 2 : space.price;
    if (space.type === 'property' && st.houses > 0) worth += st.houses * space.houseCost;
  });
  return worth;
}

async function chargePlayer(player, amount, reason, payee, category) {
  category = category || 'fees';
  if (amount <= 0) return true;
  if (player.cash < amount) {
    log(`${player.name} is short of cash and must raise funds.`, 'event');
    await raiseCash(player, amount);
  }
  if (player.cash >= amount) {
    player.cash -= amount;
    if (payee) {
      payee.cash += amount;
      log(`${player.name} paid $${amount} to ${payee.name}${reason ? ` (${reason})` : ''}.`);
    } else {
      log(`${player.name} paid $${amount}${reason ? ` (${reason})` : ''}.`);
    }
    bkCharge(player, payee, amount, reason, category);
    return true;
  }
  await goBankrupt(player, payee);
  return false;
}

function payBankToPlayer(player, amount) {
  player.cash += amount;
  if (player.id === HUMAN_ID) post('Card: collected cash', [{ acct: 'cash', dr: amount }, { acct: 'windfall', cr: amount }]);
  log(`${player.name} collected $${amount}.`, player.isHuman ? 'you' : '');
}

async function raiseCash(player, targetAmount) {
  if (player.cash >= targetAmount) return;
  if (!player.isHuman) {
    let guard = 0;
    while (player.cash < targetAmount && guard < 200) {
      guard++;
      const sellable = ownedIndicesOf(player.id).filter((i) => canSellHouseOn(i, player.id));
      if (sellable.length === 0) break;
      sellHouseOn(sellable[0], player); // always sells from a property currently at the group's max, per the even-sell rule
    }
    if (player.cash < targetAmount) {
      for (const i of ownedIndicesOf(player.id)) {
        if (player.cash >= targetAmount) break;
        const st = state.props[i];
        const space = BOARD[i];
        if (!st.mortgaged && st.houses === 0) {
          doMortgage(player, i);
        }
      }
    }
    renderAll();
  } else {
    await showRaiseCashModal(player, targetAmount);
    renderAll();
  }
}

async function goBankrupt(player, payee) {
  log(`${player.name} is BANKRUPT!`, 'event');
  const owned = ownedIndicesOf(player.id);
  const preState = owned.map((i) => ({ i, mortgaged: state.props[i].mortgaged, houses: state.props[i].houses, houseCost: BOARD[i].houseCost }));
  let buildingRefund = 0;
  for (const i of owned) {
    const st = state.props[i];
    buildingRefund += liquidateBuildingsOn(i);
    if (payee) {
      st.owner = payee.id;
    } else {
      st.owner = null;
      st.mortgaged = false;
    }
  }
  if (payee && buildingRefund > 0) {
    payee.cash += buildingRefund;
    log(`${payee.name} recovered $${buildingRefund} selling ${player.name}'s buildings back to the bank.`);
  }
  player.cash = 0;
  player.bankrupt = true;
  bkResolveBankruptcy(player, payee, preState, buildingRefund);
  renderAll();
}

async function resolvePropertySpace(player, space, opts) {
  opts = opts || {};
  const st = state.props[space.i];
  if (st.owner === null) {
    let wantsBuy;
    if (player.isHuman) {
      wantsBuy = await askModal(
        space.name,
        `Unowned. Price: $${space.price}<br>Your cash: $${player.cash}`,
        [{ label: `Buy for $${space.price}`, value: true, disabled: player.cash < space.price },
         { label: 'Pass', value: false, cls: 'secondary' }]
      );
    } else {
      await sleep(400);
      wantsBuy = aiShouldBuy(player, space);
    }
    if (wantsBuy && player.cash >= space.price) {
      player.cash -= space.price;
      st.owner = player.id;
      if (player.id === HUMAN_ID) bkBuy(space.i, space.price);
      log(`${player.name} bought ${space.name} for $${space.price}.`, player.isHuman ? 'you' : '');
      renderAll();
    } else {
      log(`${player.name} passed on ${space.name}.`);
      await runAuction(space, player.id);
    }
  } else if (st.owner === player.id) {
    log(`${player.name} owns ${space.name} already.`);
  } else if (st.mortgaged) {
    log(`${space.name} is mortgaged — no rent due.`);
  } else {
    const owner = players[st.owner];
    const rent = computeRent(space.i, state.lastDiceSum, opts.utilityMultiplierOverride) * (opts.rentMultiplier || 1);
    log(`${player.name} landed on ${space.name} (owned by ${owner.name}) — rent $${rent}.`);
    await chargePlayer(player, rent, `rent: ${space.name}`, owner, 'rent');
  }
}

/* ---------------------------------------------------------------------
   Auctions
--------------------------------------------------------------------- */

function nextBidIncrement(currentBid) {
  return Math.max(10, Math.round((currentBid * 0.08) / 10) * 10);
}

function askAuctionModal(player, space, currentBid, currentBidderId) {
  return new Promise((resolve) => {
    const leaderName = currentBidderId !== null ? players[currentBidderId].name : 'no one yet';
    const minBid = currentBid + 1;
    const suggested = Math.min(player.cash, currentBid + nextBidIncrement(currentBid));
    modalTitle.textContent = `Auction: ${space.name}`;
    modalBody.innerHTML = '';
    const info = document.createElement('div');
    info.innerHTML = `Current bid: $${currentBid} (${leaderName})<br>Your cash: $${player.cash}`;
    info.style.marginBottom = '10px';
    modalBody.appendChild(info);
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:6px;';
    const label = document.createElement('span');
    label.textContent = 'Bid: $';
    const input = document.createElement('input');
    input.type = 'number';
    input.min = minBid;
    input.max = player.cash;
    input.value = Math.max(minBid, suggested);
    input.style.cssText = 'width:90px;background:#0e1420;color:#eaeef2;border:1px solid #2c3750;border-radius:4px;padding:2px 4px;';
    row.appendChild(label);
    row.appendChild(input);
    modalBody.appendChild(row);
    modalActions.innerHTML = '';
    modalActions.appendChild(mkBtn('Place Bid', () => {
      const amount = Math.floor(Number(input.value));
      if (amount >= minBid && amount <= player.cash) { hideModal(); resolve(amount); }
    }, player.cash < minBid));
    modalActions.appendChild(mkBtn('Pass', () => { hideModal(); resolve(null); }, false, 'secondary'));
    showModal();
  });
}

function aiBidAmount(player, space, currentBid) {
  const profile = AI_PROFILES[player.id];
  const maxBid = Math.round(space.price * profile.auctionFactor);
  if (maxBid <= currentBid) return null;
  const bid = Math.min(maxBid, currentBid + nextBidIncrement(currentBid));
  if (bid <= currentBid || player.cash < bid || player.cash - bid < 50) return null;
  return bid;
}

async function runAuction(space, decliningPlayerId) {
  const allIds = players.filter((p) => !p.bankrupt).map((p) => p.id);
  if (allIds.length === 0) return;
  const startIdx = decliningPlayerId === undefined ? 0 : (Math.max(0, allIds.indexOf(decliningPlayerId)) + 1) % allIds.length;
  const orderedIds = [...allIds.slice(startIdx), ...allIds.slice(0, startIdx)];

  log(`Auction for ${space.name} begins!`, 'event');
  const activeIds = new Set(orderedIds);
  let currentBid = 0;
  let currentBidderId = null;
  let idx = 0;
  let guard = 0;

  while (activeIds.size > 1 && guard < 1000) {
    guard++;
    const pid = orderedIds[idx % orderedIds.length];
    idx++;
    if (!activeIds.has(pid) || pid === currentBidderId) continue;

    const player = players[pid];
    let bidAmount;
    if (player.isHuman) {
      bidAmount = await askAuctionModal(player, space, currentBid, currentBidderId);
    } else {
      await sleep(350);
      bidAmount = aiBidAmount(player, space, currentBid);
    }

    if (bidAmount && bidAmount > currentBid && bidAmount <= player.cash) {
      currentBid = bidAmount;
      currentBidderId = pid;
      log(`${player.name} bids $${currentBid} for ${space.name}.`, player.isHuman ? 'you' : '');
    } else {
      activeIds.delete(pid);
      log(`${player.name} drops out of the auction.`);
    }
  }

  if (currentBidderId !== null) {
    const winner = players[currentBidderId];
    winner.cash -= currentBid;
    state.props[space.i].owner = winner.id;
    if (winner.id === HUMAN_ID) bkAuctionWin(space.i, currentBid);
    log(`${winner.name} wins the auction for ${space.name} at $${currentBid}!`, winner.isHuman ? 'you' : 'event');
  } else {
    log(`No bids — ${space.name} remains unowned.`, 'event');
  }
  renderAll();
}

/* ---------------------------------------------------------------------
   Trading
--------------------------------------------------------------------- */

function propertyValue(ownerId, i) {
  const space = BOARD[i];
  const st = state.props[i];
  let value = space.price;
  if (st.mortgaged) value *= 0.5;
  if (space.type === 'property') {
    const group = COLOR_GROUPS[space.color];
    const ownedByPlayer = group.filter((j) => state.props[j].owner === ownerId).length;
    if (ownedByPlayer === group.length - 1) value *= 2.5;
    else if (ownedByPlayer > 0) value *= 1.4;
  }
  return value;
}

function offerSideValue(forPlayerId, side) {
  let v = side.cash + side.cards * 50;
  side.props.forEach((i) => { v += propertyValue(forPlayerId, i); });
  return v;
}

function offerListValue(side) {
  let v = side.cash + side.cards * 50;
  side.props.forEach((i) => { v += BOARD[i].price; });
  return v;
}
function offerSideDescription(side) {
  const parts = [];
  if (side.cash) parts.push(`$${side.cash}`);
  side.props.forEach((i) => parts.push(BOARD[i].name));
  if (side.cards) parts.push(`${side.cards} Get Out of Jail Free card${side.cards > 1 ? 's' : ''}`);
  return parts.length ? parts.join(', ') : 'nothing';
}
function humanNetInOffer(offer) {
  const humanIsFrom = offer.fromId === HUMAN_ID;
  const giveSide = humanIsFrom ? offer.give : offer.take;
  const getSide = humanIsFrom ? offer.take : offer.give;
  return {
    gives: offerListValue(giveSide), gets: offerListValue(getSide),
    givesDesc: offerSideDescription(giveSide), getsDesc: offerSideDescription(getSide),
  };
}

async function executeTrade(offer) {
  const from = players[offer.fromId];
  const to = players[offer.toId];

  bkTrade(offer);

  offer.give.props.forEach((i) => { state.props[i].owner = to.id; });
  offer.take.props.forEach((i) => { state.props[i].owner = from.id; });

  from.cash -= offer.give.cash;
  to.cash += offer.give.cash;
  to.cash -= offer.take.cash;
  from.cash += offer.take.cash;

  from.goojCards -= offer.give.cards;
  to.goojCards += offer.give.cards;
  to.goojCards -= offer.take.cards;
  from.goojCards += offer.take.cards;

  for (const i of offer.give.props) {
    if (state.props[i].mortgaged) await chargePlayer(to, Math.round(BOARD[i].price * 0.05), `mortgage interest: ${BOARD[i].name}`, null, 'interest');
  }
  for (const i of offer.take.props) {
    if (state.props[i].mortgaged) await chargePlayer(from, Math.round(BOARD[i].price * 0.05), `mortgage interest: ${BOARD[i].name}`, null, 'interest');
  }
  renderAll();
}

function aiDecideOnOffer(ai, offer, round) {
  if (offer.take.cash > ai.cash) return 'reject';
  if (offer.take.cards > ai.goojCards) return 'reject';
  if (offer.take.props.some((i) => state.props[i].owner !== ai.id)) return 'reject';

  const receiveValue = offerSideValue(ai.id, offer.give);
  // Value what we GIVE AWAY as the max of its worth to us and its "denial" worth to
  // the recipient — i.e. how much handing it over helps them. This stops the AI from
  // selling the one property an opponent needs to complete a monopoly for base price:
  // if the piece completes the proposer's group it's worth 2.5x to them, so the AI now
  // demands roughly that much (or refuses) instead of parting with it cheaply.
  let giveValue = offer.take.cash + offer.take.cards * 50;
  offer.take.props.forEach((i) => {
    giveValue += Math.max(propertyValue(ai.id, i), propertyValue(offer.fromId, i));
  });
  const netGain = receiveValue - giveValue;

  if (netGain >= 0) return 'accept';
  if (round >= TRADE_ROUND_CAP) return 'reject';

  const proposer = players[offer.fromId];
  const shortfall = Math.ceil(-netGain);
  const maxExtraCash = Math.max(0, proposer.cash - offer.give.cash);
  const extraCash = Math.min(shortfall, maxExtraCash);
  if (extraCash <= 0) return 'reject';

  return {
    fromId: ai.id,
    toId: offer.fromId,
    give: { props: [...offer.take.props], cash: offer.take.cash, cards: offer.take.cards },
    take: { props: [...offer.give.props], cash: offer.give.cash + extraCash, cards: offer.give.cards },
  };
}

async function proposeAndNegotiate(initialOffer) {
  let offer = initialOffer;
  let round = 1;
  const thread = [{ by: offer.fromId, offer }];
  const involvesHuman = players[offer.fromId].isHuman || players[offer.toId].isHuman;
  const pairKey = [offer.fromId, offer.toId].sort((a, b) => a - b).join('-');
  state.negotiationLogs = state.negotiationLogs || {};
  state.negotiationLogs[pairKey] = thread;

  log(`${players[offer.fromId].name} proposes a trade to ${players[offer.toId].name}.`, 'event');

  while (true) {
    const responder = players[offer.toId];
    let decision;
    if (responder.isHuman) {
      decision = await askHumanTradeDecision(thread, offer, round);
    } else {
      await sleep(450);
      decision = aiDecideOnOffer(responder, offer, round);
    }

    if (decision === 'accept') {
      thread.push({ by: responder.id, type: 'accept' });
      if (involvesHuman) { renderTradeThread(thread); await sleep(700); hideModal(); }
      if (involvesHuman) {
        const net = humanNetInOffer(offer);
        if (net.gives > 0 && net.gets === 0) {
          const proceed = await askModal('One-sided trade',
            `Heads up — this deal has you giving up ${net.givesDesc} and getting nothing in return. Proceed?`,
            [{ label: 'Cancel trade', value: false }, { label: 'Proceed anyway', value: true }]);
          if (!proceed) { log(`${players[HUMAN_ID].name} called off the trade.`, 'you'); return; }
        }
      }
      await executeTrade(offer);
      log(`${players[offer.fromId].name} and ${responder.name} struck a deal!`, involvesHuman ? 'you' : 'event');
      return;
    }
    if (decision === 'reject' || round >= TRADE_ROUND_CAP) {
      thread.push({ by: responder.id, type: decision === 'reject' ? 'reject' : 'stalled' });
      if (involvesHuman) { renderTradeThread(thread); await sleep(700); hideModal(); }
      log(`Trade talks between ${players[offer.fromId].name} and ${responder.name} fell through.`, 'event');
      return;
    }

    offer = decision;
    round++;
    thread.push({ by: offer.fromId, offer });
  }
}

function aiFindBuyOpportunity(ai) {
  for (const color in COLOR_GROUPS) {
    const group = COLOR_GROUPS[color];
    const ownedByAI = group.filter((j) => state.props[j].owner === ai.id);
    if (ownedByAI.length === 0 || ownedByAI.length === group.length) continue;
    const missing = group.filter((j) => state.props[j].owner !== ai.id);
    if (missing.some((j) => state.props[j].owner === null || state.props[j].houses > 0)) continue;
    const owners = new Set(missing.map((j) => state.props[j].owner));
    if (owners.size !== 1) continue;
    const ownerId = [...owners][0];
    if (ownerId === ai.id || players[ownerId].bankrupt) continue;
    return { targetId: ownerId, wantProps: missing };
  }
  return null;
}

function aiFindSellOpportunity(ai) {
  const profile = AI_PROFILES[ai.id];
  if (ai.cash >= profile.cashFloor) return null;
  const owned = tradeablePropertiesOf(ai.id).filter((i) => BOARD[i].type === 'property');
  for (const i of owned) {
    const space = BOARD[i];
    const group = COLOR_GROUPS[space.color];
    const ownedByAI = group.filter((j) => state.props[j].owner === ai.id).length;
    if (ownedByAI > 1) continue;
    const candidates = players.filter((p) => p.id !== ai.id && !p.bankrupt);
    if (candidates.length === 0) continue;
    let buyer = candidates.find((p) => group.some((j) => state.props[j].owner === p.id));
    if (!buyer) buyer = candidates[0];
    return { targetId: buyer.id, sellProp: i };
  }
  return null;
}

async function aiConsiderTrade(ai) {
  if (state.gameOver || ai.bankrupt) return;

  const buyOpp = aiFindBuyOpportunity(ai);
  if (buyOpp) {
    const profile = AI_PROFILES[ai.id];
    const value = buyOpp.wantProps.reduce((s, j) => s + propertyValue(ai.id, j), 0);
    const cashOffer = Math.min(Math.round(value * profile.auctionFactor), Math.max(0, ai.cash - 100));
    if (cashOffer > 0) {
      await proposeAndNegotiate({
        fromId: ai.id,
        toId: buyOpp.targetId,
        give: { props: [], cash: cashOffer, cards: 0 },
        take: { props: buyOpp.wantProps, cash: 0, cards: 0 },
      });
      return;
    }
  }

  const sellOpp = aiFindSellOpportunity(ai);
  if (sellOpp) {
    const price = Math.round(BOARD[sellOpp.sellProp].price * 0.9);
    await proposeAndNegotiate({
      fromId: ai.id,
      toId: sellOpp.targetId,
      give: { props: [sellOpp.sellProp], cash: 0, cards: 0 },
      take: { props: [], cash: price, cards: 0 },
    });
  }
}

async function drawCard(player, deckName) {
  const deck = deckName === 'chance' ? CHANCE_CARDS : CHEST_CARDS;
  const card = deck[Math.floor(Math.random() * deck.length)];
  log(`${player.name} drew a ${deckName === 'chance' ? 'Chance' : 'Community Chest'} card: "${card.text}"`, 'event');
  if (player.isHuman) {
    await askModal(deckName === 'chance' ? 'Chance' : 'Community Chest', card.text, [{ label: 'OK', value: true }]);
  } else {
    await sleep(500);
  }
  await applyCard(player, card);
}

async function applyCard(player, card) {
  switch (card.kind) {
    case 'advanceTo':
      moveDirect(player, card.to);
      renderAll(); await sleep(300);
      await resolveLanding(player);
      break;
    case 'nearestRailroad': {
      const dest = nearestOf([5, 15, 25, 35], player.position);
      moveDirect(player, dest);
      renderAll(); await sleep(300);
      await resolvePropertySpace(player, BOARD[dest], { rentMultiplier: 2 });
      break;
    }
    case 'nearestUtility': {
      const dest = nearestOf([12, 28], player.position);
      moveDirect(player, dest);
      renderAll(); await sleep(300);
      await resolvePropertySpace(player, BOARD[dest], { utilityMultiplierOverride: 10 });
      break;
    }
    case 'move': {
      const dest = (player.position + card.by + 40) % 40;
      moveDirect(player, dest, { passGo: false });
      renderAll(); await sleep(300);
      await resolveLanding(player);
      break;
    }
    case 'goToJail':
      sendToJail(player);
      break;
    case 'collect':
      payBankToPlayer(player, card.amount);
      break;
    case 'pay':
      await chargePlayer(player, card.amount, card.text, null, 'fees');
      break;
    case 'payEach':
      for (const p of players) {
        if (p !== player && !p.bankrupt) await chargePlayer(player, card.amount, 'paid to ' + p.name, p, 'gift');
      }
      break;
    case 'collectEach':
      for (const p of players) {
        if (p !== player && !p.bankrupt) await chargePlayer(p, card.amount, 'birthday gift', player, 'gift');
      }
      break;
    case 'getOutOfJail':
      player.goojCards = (player.goojCards || 0) + 1;
      log(`${player.name} now holds a Get Out of Jail Free card.`);
      break;
    case 'repairs': {
      let houses = 0, hotels = 0;
      for (const i of ownedIndicesOf(player.id)) {
        const st = state.props[i];
        if (st.houses === 5) hotels++;
        else houses += st.houses;
      }
      const amt = houses * card.house + hotels * card.hotel;
      await chargePlayer(player, amt, 'repairs', null, 'fees');
      break;
    }
  }
}

async function payTax(player, space) {
  let amount = space.amount;
  if (space.altPercent) {
    const altAmount = Math.round(computeNetWorth(player) * space.altPercent);
    if (player.isHuman) {
      amount = await askModal(
        space.name,
        `Pay a flat $${space.amount}, or ${space.altPercent * 100}% of your net worth?<br>Your net worth: $${computeNetWorth(player)} (${space.altPercent * 100}% = $${altAmount})`,
        [
          { label: `Pay $${space.amount}`, value: space.amount },
          { label: `Pay $${altAmount} (${space.altPercent * 100}%)`, value: altAmount },
        ]
      );
    } else {
      amount = Math.min(space.amount, altAmount);
    }
  }
  await chargePlayer(player, amount, space.name, null, 'tax');
}

async function resolveLanding(player) {
  const space = BOARD[player.position];
  switch (space.type) {
    case 'go': log(`${player.name} is on GO.`); break;
    case 'freeparking': log(`${player.name} landed on Free Parking. Nothing happens.`); break;
    case 'jail': log(`${player.name} is just visiting Jail.`); break;
    case 'gotojail': sendToJail(player); break;
    case 'tax': await payTax(player, space); break;
    case 'chance': await drawCard(player, 'chance'); break;
    case 'chest': await drawCard(player, 'chest'); break;
    case 'property': case 'railroad': case 'utility':
      await resolvePropertySpace(player, space);
      break;
  }
}

/* ---------------------------------------------------------------------
   AI logic
--------------------------------------------------------------------- */

function aiShouldBuy(player, space) {
  const profile = AI_PROFILES[player.id];
  return player.cash - space.price >= profile.buyBuffer;
}

function aiJailDecision(player) {
  const profile = AI_PROFILES[player.id];
  if (player.goojCards > 0) return 'card';
  if (player.cash >= profile.jailPayThreshold + 50) return 'pay';
  return 'roll';
}

async function aiTakeBuildActions(player) {
  const profile = AI_PROFILES[player.id];
  let built = true;
  let guard = 0;
  while (built && guard < 30) {
    guard++;
    built = false;
    for (const color in COLOR_GROUPS) {
      const idxs = COLOR_GROUPS[color];
      const buildable = idxs.filter((i) => canBuildHouseOn(i, player.id));
      if (buildable.length === 0) continue;
      const target = buildable[0];
      const cost = BOARD[target].houseCost;
      if (player.cash - cost >= profile.buildBuffer && buildHouseOn(target, player)) {
        log(`${player.name} built ${state.props[target].houses === 5 ? 'a hotel' : 'a house'} on ${BOARD[target].name}.`);
        built = true;
      }
    }
  }
  renderAll();
}

/* ---------------------------------------------------------------------
   Turn engine
--------------------------------------------------------------------- */

function waitForRollClick() {
  rollBtn.disabled = false;
  setStatus('Your turn — roll the dice.');
  return new Promise((resolve) => { pendingRollResolve = resolve; });
}

function waitForEndTurnClick() {
  endTurnBtn.disabled = false;
  setStatus('Review your properties, then end your turn.');
  return new Promise((resolve) => { pendingEndTurnResolve = resolve; });
}

async function doRoll(player) {
  if (player.isHuman) {
    await waitForRollClick();
    rollBtn.disabled = true;
  } else {
    setStatus(`${player.name} is rolling...`);
    await sleep(600);
  }
  const d1 = 1 + Math.floor(Math.random() * 6);
  const d2 = 1 + Math.floor(Math.random() * 6);
  showDiceFaces(d1, d2);
  state.lastDiceSum = d1 + d2;
  log(`${player.name} rolled ${d1} + ${d2} = ${d1 + d2}${d1 === d2 ? ' (doubles!)' : ''}.`, player.isHuman ? 'you' : '');
  await sleep(400);
  return [d1, d2];
}

async function handleJail(player) {
  let action;
  if (player.isHuman) {
    action = await askModal(
      'You are in Jail',
      `Attempt ${player.jailTurns + 1} of 3. Cash: $${player.cash}. GOOJ cards: ${player.goojCards}`,
      [
        { label: 'Pay $50 to get out', value: 'pay', disabled: player.cash < 50 },
        { label: 'Use Get Out of Jail Free card', value: 'card', disabled: player.goojCards < 1 },
        { label: 'Try to roll doubles', value: 'roll', cls: 'secondary' },
      ]
    );
  } else {
    action = aiJailDecision(player);
    await sleep(400);
  }

  if (action === 'pay') {
    await chargePlayer(player, 50, 'jail fee', null, 'fees');
    if (player.bankrupt) return 'bankrupt';
    player.inJail = false; player.jailTurns = 0;
    log(`${player.name} paid $50 and left Jail.`);
    return 'escaped-pay';
  }
  if (action === 'card') {
    player.goojCards--; player.inJail = false; player.jailTurns = 0;
    log(`${player.name} used a Get Out of Jail Free card.`);
    return 'escaped-pay';
  }

  const [d1, d2] = await doRoll(player);
  if (d1 === d2) {
    player.inJail = false; player.jailTurns = 0;
    log(`${player.name} rolled doubles and is out of Jail!`);
    movePlayerBySteps(player, d1 + d2);
    renderAll(); await sleep(400);
    await resolveLanding(player);
    return 'escaped-roll';
  }
  player.jailTurns++;
  if (player.jailTurns >= 3) {
    log(`${player.name} failed 3 times — must pay $50 and move.`);
    await chargePlayer(player, 50, 'jail fee', null, 'fees');
    if (player.bankrupt) return 'bankrupt';
    player.inJail = false; player.jailTurns = 0;
    movePlayerBySteps(player, d1 + d2);
    renderAll(); await sleep(400);
    await resolveLanding(player);
    return 'escaped-roll';
  }
  log(`${player.name} stays in Jail.`);
  return 'stayed';
}

function showGameOverModal(msg) {
  askModal('Game Over', msg, [
    { label: 'View Books', value: 'books' },
    { label: 'New Game', value: 'new' },
  ]).then((choice) => {
    if (choice === 'books') {
      booksReturnToGameOver = msg;
      openBooksModal();
    } else {
      location.reload();
    }
  });
}

function checkGameOver() {
  if (state.gameOver) return true;
  const alive = players.filter((p) => !p.bankrupt);
  if (players[0].bankrupt || alive.length <= 1) {
    state.gameOver = true;
    let msg;
    if (alive.length === 1) { const w = alive[0]; msg = `🏆 ${w.name} ${w.id === HUMAN_ID ? 'win' : 'wins'} the game!`; }
    else if (alive.length === 0) msg = 'Everyone went bankrupt. Game over.';
    else msg = 'You went bankrupt. Game over.';
    log(msg, 'event');
    rollBtn.disabled = true; endTurnBtn.disabled = true; manageBtn.disabled = true; tradeBtn.disabled = true; booksBtn.disabled = true; advisorBtn.disabled = true;
    setStatus(msg);
    showGameOverModal(msg);
    return true;
  }
  return false;
}

async function playTurn(player) {
  state.currentIndex = player.id;
  if (player.id === HUMAN_ID && !player.bankrupt) booksAdvancePeriod();
  renderAll();
  if (player.bankrupt) { nextTurn(); return; }

  log(`—— ${player.name}'s turn ——`, 'event');

  if (player.inJail) {
    const result = await handleJail(player);
    if (checkGameOver()) return;
    renderAll();
    if (result === 'stayed' || result === 'bankrupt') {
      await sleep(player.isHuman ? 300 : 600);
      nextTurn();
      return;
    }
    if (result === 'escaped-roll') {
      await finishTurn(player);
      return;
    }
    // 'escaped-pay' falls through to a normal roll below
  }

  let doublesStreak = 0;
  let active = true;
  while (active) {
    const [d1, d2] = await doRoll(player);
    const isDouble = d1 === d2;
    doublesStreak = isDouble ? doublesStreak + 1 : 0;

    if (doublesStreak === 3) {
      log(`${player.name} rolled doubles three times in a row — straight to Jail!`, 'event');
      sendToJail(player);
      renderAll();
      active = false;
      break;
    }

    movePlayerBySteps(player, d1 + d2);
    renderAll();
    await sleep(400);
    await resolveLanding(player);
    if (checkGameOver()) return;
    renderAll();

    if (player.bankrupt || player.inJail) { active = false; break; }
    if (!isDouble) { active = false; }
    else { log(`${player.name} rolled doubles and goes again!`); await sleep(300); }
  }

  await finishTurn(player);
}

async function finishTurn(player) {
  if (checkGameOver()) return;
  if (!player.isHuman && !player.bankrupt) {
    await aiConsiderTrade(player);
    if (checkGameOver()) return;
    await aiTakeBuildActions(player);
  }
  renderAll();
  if (player.isHuman && !player.bankrupt) {
    await waitForEndTurnClick();
    endTurnBtn.disabled = true;
  } else {
    await sleep(500);
  }
  if (checkGameOver()) return;
  nextTurn();
}

function nextTurn() {
  if (checkGameOver()) return;
  let next = state.currentIndex;
  do { next = (next + 1) % 4; } while (players[next].bankrupt);
  playTurn(players[next]);
}

/* =====================================================================
   Double-entry accounting ("books") — kept for the HUMAN player (id 0)
   only. Every value-moving game event posts a balanced journal entry.
   Historical-cost basis. 1 round (all four players roll) = 1 game-month;
   3 = quarter, 12 = year, with a visible year-end close.
   ===================================================================== */

const HUMAN_ID = 0;

const ACCOUNTS = {
  cash:         { code: '1000', name: 'Cash',                   type: 'asset' },
  realEstate:   { code: '1100', name: 'Real Estate — at cost',  type: 'asset' },
  improvements: { code: '1200', name: 'Improvements — at cost', type: 'asset' },
  mortgages:    { code: '2000', name: 'Mortgages Payable',      type: 'liability' },
  capital:      { code: '3000', name: "Owner's Capital",        type: 'equity' },
  retained:     { code: '3100', name: 'Retained Earnings',      type: 'equity' },
  salary:       { code: '4000', name: 'GO Salary Income',       type: 'revenue' },
  rentInc:      { code: '4100', name: 'Rent Income',            type: 'revenue' },
  windfall:     { code: '4200', name: 'Windfall Income',        type: 'revenue' },
  gain:         { code: '4300', name: 'Gain on Disposal',       type: 'revenue' },
  rentExp:      { code: '5000', name: 'Rent Expense',           type: 'expense' },
  taxExp:       { code: '5100', name: 'Tax Expense',            type: 'expense' },
  interest:     { code: '5200', name: 'Interest Expense',       type: 'expense' },
  fees:         { code: '5300', name: 'Fees & Penalties',       type: 'expense' },
  loss:         { code: '5400', name: 'Loss on Disposal',       type: 'expense' },
};

const books = {
  entries: [],   // { n, period:{y,m,label}, desc, lines:[{acct,dr,cr}], closing }
  bal: {},       // account key -> (sum debits - sum credits)
  basis: {},     // property index -> human's recorded real-estate cost
  month: 0,      // current game-month (1-based once play starts)
  seq: 0,
  started: false,
};
Object.keys(ACCOUNTS).forEach((k) => { books.bal[k] = 0; });

function periodLabel(m) {
  m = m || 1;
  const y = Math.floor((m - 1) / 12) + 1;
  const mm = ((m - 1) % 12) + 1;
  return { y, m: mm, label: `Y${y}-M${String(mm).padStart(2, '0')}` };
}

function post(desc, lines, opts) {
  lines = lines.filter((l) => (l.dr || 0) !== 0 || (l.cr || 0) !== 0);
  if (!lines.length) return null;
  lines.forEach((l) => { books.bal[l.acct] += (l.dr || 0) - (l.cr || 0); });
  const e = {
    n: ++books.seq,
    period: periodLabel(books.month),
    desc,
    lines: lines.map((l) => ({ acct: l.acct, dr: l.dr || 0, cr: l.cr || 0 })),
    closing: !!(opts && opts.closing),
  };
  books.entries.push(e);
  booksToast(e);
  if (booksPanelOpen) renderBooksPanel();
  if (typeof booksWindow !== 'undefined' && booksWindow && !booksWindow.closed) renderBooksWindow();
  return e;
}

/* ---- Event → journal entry helpers ---- */

function bkOpening() {
  post('Opening capital — start of game', [{ acct: 'cash', dr: 1500 }, { acct: 'capital', cr: 1500 }]);
}
function bkGo() {
  post('Passed GO — salary', [{ acct: 'cash', dr: 200 }, { acct: 'salary', cr: 200 }]);
}
function bkBuy(i, price) {
  books.basis[i] = price;
  post(`Bought ${BOARD[i].name}`, [{ acct: 'realEstate', dr: price }, { acct: 'cash', cr: price }]);
}
function bkAuctionWin(i, bid) {
  books.basis[i] = bid;
  post(`Won at auction: ${BOARD[i].name}`, [{ acct: 'realEstate', dr: bid }, { acct: 'cash', cr: bid }]);
}
function bkBuild(i, cost, isHotel) {
  post(`Built ${isHotel ? 'a hotel' : 'a house'} on ${BOARD[i].name}`,
    [{ acct: 'improvements', dr: cost }, { acct: 'cash', cr: cost }]);
}
function bkSellBuilding(i, cost) {
  const cash = cost / 2;
  post(`Sold a building on ${BOARD[i].name}`,
    [{ acct: 'cash', dr: cash }, { acct: 'loss', dr: cost - cash }, { acct: 'improvements', cr: cost }]);
}
function bkMortgage(i, amt) {
  post(`Mortgaged ${BOARD[i].name}`, [{ acct: 'cash', dr: amt }, { acct: 'mortgages', cr: amt }]);
}
function bkUnmortgage(i, principal, interest) {
  post(`Unmortgaged ${BOARD[i].name}`,
    [{ acct: 'mortgages', dr: principal }, { acct: 'interest', dr: interest }, { acct: 'cash', cr: principal + interest }]);
}

const CHARGE_ACCT = {
  rent:     { exp: 'rentExp',  inc: 'rentInc' },
  tax:      { exp: 'taxExp',   inc: null },
  interest: { exp: 'interest', inc: null },
  fees:     { exp: 'fees',     inc: null },
  gift:     { exp: 'fees',     inc: 'windfall' },
};

function bkCharge(payer, payee, amount, reason, category) {
  const m = CHARGE_ACCT[category] || CHARGE_ACCT.fees;
  if (payer && payer.id === HUMAN_ID && m.exp) {
    post(reason || 'Payment', [{ acct: m.exp, dr: amount }, { acct: 'cash', cr: amount }]);
  }
  if (payee && payee.id === HUMAN_ID && m.inc) {
    post(reason || 'Receipt', [{ acct: 'cash', dr: amount }, { acct: m.inc, cr: amount }]);
  }
}

// Fair-value method: property received recorded at board list price; property
// given removed at book cost; mortgages travel with the property; the balancing
// difference is a realized gain or loss on the exchange.
function bkTrade(offer) {
  if (offer.fromId !== HUMAN_ID && offer.toId !== HUMAN_ID) return;
  const isFrom = offer.fromId === HUMAN_ID;
  const give = isFrom ? offer.give : offer.take;   // what the human gives up
  const recv = isFrom ? offer.take : offer.give;   // what the human receives
  const lines = [];
  const netCash = recv.cash - give.cash;
  if (netCash > 0) lines.push({ acct: 'cash', dr: netCash });
  else if (netCash < 0) lines.push({ acct: 'cash', cr: -netCash });

  recv.props.forEach((i) => {
    const price = BOARD[i].price;
    lines.push({ acct: 'realEstate', dr: price });
    books.basis[i] = price;
    if (state.props[i].mortgaged) lines.push({ acct: 'mortgages', cr: price / 2 });
  });
  give.props.forEach((i) => {
    const basis = (books.basis[i] != null) ? books.basis[i] : BOARD[i].price;
    lines.push({ acct: 'realEstate', cr: basis });
    if (state.props[i].mortgaged) lines.push({ acct: 'mortgages', dr: BOARD[i].price / 2 });
    delete books.basis[i];
  });

  const dr = lines.reduce((s, l) => s + (l.dr || 0), 0);
  const cr = lines.reduce((s, l) => s + (l.cr || 0), 0);
  const diff = dr - cr;
  if (diff > 0) lines.push({ acct: 'gain', cr: diff });
  else if (diff < 0) lines.push({ acct: 'loss', dr: -diff });

  const other = players[isFrom ? offer.toId : offer.fromId].name;
  post(`Trade with ${other}`, lines);
}

// Called from goBankrupt AFTER cash is zeroed. preState captures each owned
// property's pre-liquidation buildings and pre-reset mortgage status.
function bkResolveBankruptcy(player, payee, preState, buildingRefund) {
  if (player.id === HUMAN_ID) {
    const lines = [];
    preState.forEach((p) => {
      if (books.basis[p.i] != null) { lines.push({ acct: 'realEstate', cr: books.basis[p.i] }); delete books.basis[p.i]; }
      if (p.houses > 0) lines.push({ acct: 'improvements', cr: p.houses * p.houseCost });
      if (p.mortgaged) lines.push({ acct: 'mortgages', dr: BOARD[p.i].price / 2 });
    });
    // remaining cash on the books goes to zero
    if (Math.round(books.bal.cash) !== 0) lines.push({ acct: 'cash', cr: books.bal.cash });
    const dr = lines.reduce((s, l) => s + (l.dr || 0), 0);
    const cr = lines.reduce((s, l) => s + (l.cr || 0), 0);
    const diff = dr - cr;
    if (diff > 0) lines.push({ acct: 'gain', cr: diff });
    else if (diff < 0) lines.push({ acct: 'loss', dr: -diff });
    post('Bankruptcy — assets surrendered, books closed out', lines);
  } else if (payee && payee.id === HUMAN_ID) {
    const lines = [];
    preState.forEach((p) => {
      const price = BOARD[p.i].price;
      lines.push({ acct: 'realEstate', dr: price });
      books.basis[p.i] = price;
      if (p.mortgaged) lines.push({ acct: 'mortgages', cr: price / 2 });
    });
    if (buildingRefund > 0) lines.push({ acct: 'cash', dr: buildingRefund });
    const dr = lines.reduce((s, l) => s + (l.dr || 0), 0);
    const cr = lines.reduce((s, l) => s + (l.cr || 0), 0);
    const diff = dr - cr;
    if (diff > 0) lines.push({ acct: 'windfall', cr: diff });
    else if (diff < 0) lines.push({ acct: 'loss', dr: -diff });
    if (lines.length) post(`Inherited ${player.name}'s estate`, lines);
  }
}

/* ---- Mortgage helpers (shared by human UI and AI liquidation) ---- */

function doMortgage(player, i) {
  const sp = BOARD[i];
  state.props[i].mortgaged = true;
  const amt = sp.price / 2;
  player.cash += amt;
  if (player.id === HUMAN_ID) bkMortgage(i, amt);
  log(`${player.name} mortgaged ${sp.name} for $${amt}.`);
}

function doUnmortgage(player, i) {
  const sp = BOARD[i];
  const cost = Math.round(sp.price * 0.55);
  if (player.cash < cost) return false;
  player.cash -= cost;
  state.props[i].mortgaged = false;
  const principal = sp.price / 2;
  if (player.id === HUMAN_ID) bkUnmortgage(i, principal, cost - principal);
  return true;
}

/* ---- Period control & year-end close ---- */

function booksAdvancePeriod() {
  if (!books.started) {
    books.started = true;
    books.month = 1;
    bkOpening();
  } else {
    if (books.month % 12 === 0) runYearEndClose(books.month / 12);
    books.month += 1;
  }
  if (typeof updateButtons === 'function') updateButtons();
}

function runYearEndClose(yearNum) {
  const revKeys = Object.keys(ACCOUNTS).filter((k) => ACCOUNTS[k].type === 'revenue');
  const expKeys = Object.keys(ACCOUNTS).filter((k) => ACCOUNTS[k].type === 'expense');
  const lines = [];
  let rev = 0, exp = 0;
  revKeys.forEach((k) => { const b = -books.bal[k]; if (Math.abs(b) > 1e-9) { lines.push({ acct: k, dr: b }); rev += b; } });
  expKeys.forEach((k) => { const b = books.bal[k]; if (Math.abs(b) > 1e-9) { lines.push({ acct: k, cr: b }); exp += b; } });
  const net = rev - exp;
  if (net >= 0) lines.push({ acct: 'retained', cr: net });
  else lines.push({ acct: 'retained', dr: -net });
  post(`Year-end close — Year ${yearNum}`, lines, { closing: true });
  log(`\uD83D\uDCD5 Year ${yearNum} closed — net ${net >= 0 ? 'income' : 'loss'} of $${Math.abs(Math.round(net))} swept to Retained Earnings.`, 'event');
}

/* ---- Statements (computed by replaying the journal up to a chosen month) ---- */

function bucketOf(acct) {
  if (acct === 'realEstate' || acct === 'improvements') return 'Investing';
  if (acct === 'mortgages' || acct === 'capital' || acct === 'retained') return 'Financing';
  const t = ACCOUNTS[acct].type;
  if (t === 'revenue' || t === 'expense') return 'Operating';
  return null;
}

function computeStatements(upto) {
  upto = upto || books.month || 1;
  const bal = {}; Object.keys(ACCOUNTS).forEach((k) => { bal[k] = 0; });
  const year = Math.floor((upto - 1) / 12) + 1;
  const yStart = (year - 1) * 12 + 1;
  const rev = {}, exp = {};
  const flow = { Operating: 0, Investing: 0, Financing: 0 };
  let beginCash = 0;
  books.entries.forEach((e) => {
    const am = (e.period.y - 1) * 12 + e.period.m;
    if (am > upto) return;
    // A year-end close belongs to the boundary INTO the next year: when viewing
    // its own fiscal year, treat that year as not yet closed (income still live).
    const skipClose = e.closing && e.period.y >= year;
    e.lines.forEach((l) => {
      if (am < yStart && l.acct === 'cash') beginCash += l.dr - l.cr;
      if (!skipClose) bal[l.acct] += l.dr - l.cr;
    });
    if (!e.closing && am >= yStart) {
      e.lines.forEach((l) => {
        const t = ACCOUNTS[l.acct].type;
        if (t === 'revenue') rev[l.acct] = (rev[l.acct] || 0) + (l.cr - l.dr);
        if (t === 'expense') exp[l.acct] = (exp[l.acct] || 0) + (l.dr - l.cr);
        if (l.acct !== 'cash') { const b = bucketOf(l.acct); if (b) flow[b] += -(l.dr - l.cr); }
      });
    }
  });
  const assets = { cash: bal.cash, realEstate: bal.realEstate, improvements: bal.improvements };
  const totalAssets = assets.cash + assets.realEstate + assets.improvements;
  const liabilities = -bal.mortgages;
  const capital = -bal.capital;
  const retained = -bal.retained;
  const revTotal = Object.values(rev).reduce((a, b) => a + b, 0);
  const expTotal = Object.values(exp).reduce((a, b) => a + b, 0);
  const netIncome = revTotal - expTotal;
  const equity = capital + retained + netIncome;
  return { bal, assets, totalAssets, liabilities, capital, retained, rev, exp, revTotal, expTotal, netIncome, equity, flow, beginCash, endCash: bal.cash, year };
}

/* ---- Books panel UI (reuses the shared modal shell) ---- */

let booksPanelOpen = false;
let booksTab = 'journal';
let booksAsOf = 1;
let booksToastEl = null;

function m$(n) { n = Math.round(n); return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(); }

function booksToast(entry) {
  if (!booksToastEl) { booksToastEl = document.createElement('div'); booksToastEl.id = 'books-toasts'; document.body.appendChild(booksToastEl); }
  const t = document.createElement('div');
  t.className = 'books-toast';
  const drs = entry.lines.filter((l) => l.dr > 0).map((l) => `Dr ${ACCOUNTS[l.acct].name} ${m$(l.dr)}`);
  const crs = entry.lines.filter((l) => l.cr > 0).map((l) => `Cr ${ACCOUNTS[l.acct].name} ${m$(l.cr)}`);
  t.innerHTML = `<div class="bt-desc">\uD83D\uDCD8 ${entry.desc}</div><div class="bt-lines">${drs.concat(crs).join('<br>')}</div>`;
  booksToastEl.appendChild(t);
  setTimeout(() => { t.classList.add('fade'); }, 2600);
  setTimeout(() => { t.remove(); }, 3200);
  while (booksToastEl.children.length > 4) booksToastEl.removeChild(booksToastEl.firstChild);
}

function openBooksModal() {
  booksPanelOpen = true;
  booksTab = 'journal';
  booksAsOf = books.month || 1;
  renderBooksPanel();
  showModal();
}
let booksReturnToGameOver = null;
function closeBooks() {
  booksPanelOpen = false;
  hideModal();
  if (booksReturnToGameOver) {
    const m = booksReturnToGameOver;
    booksReturnToGameOver = null;
    showGameOverModal(m);
  }
}

function ledgerTotals() {
  const t = {}; Object.keys(ACCOUNTS).forEach((k) => { t[k] = { dr: 0, cr: 0 }; });
  books.entries.forEach((e) => e.lines.forEach((l) => { t[l.acct].dr += l.dr; t[l.acct].cr += l.cr; }));
  return t;
}

function renderJournalHtml() {
  if (!books.entries.length) return '<div style="color:#7f93ac;">No entries yet — the game hasn\'t started.</div>';
  return books.entries.slice().reverse().map((e) => {
    const lines = e.lines.map((l) => {
      const nm = ACCOUNTS[l.acct].name;
      return l.dr > 0
        ? `<div class="je-line"><span class="dr">Dr ${nm}</span><span>${m$(l.dr)}</span></div>`
        : `<div class="je-line"><span class="cr">Cr ${nm}</span><span>${m$(l.cr)}</span></div>`;
    }).join('');
    return `<div class="books-je"><div class="je-head">#${e.n} · ${e.period.label}${e.closing ? ' · CLOSING' : ''} — ${e.desc}</div>${lines}</div>`;
  }).join('');
}

function renderLedgerHtml() {
  // Group every posting under its account, split into debit and credit sides.
  const dr = {}, cr = {};
  Object.keys(ACCOUNTS).forEach((k) => { dr[k] = []; cr[k] = []; });
  books.entries.forEach((e) => e.lines.forEach((l) => {
    if (l.dr > 0) dr[l.acct].push({ d: e.desc, a: l.dr });
    if (l.cr > 0) cr[l.acct].push({ d: e.desc, a: l.cr });
  }));
  const order = ['asset', 'liability', 'equity', 'revenue', 'expense'];
  const titles = { asset: 'Assets', liability: 'Liabilities', equity: 'Equity', revenue: 'Revenue', expense: 'Expenses' };
  const rowsHtml = (list) => list.length
    ? list.map((x) => `<div class="tacct-row"><span class="lbl">${esc(x.d)}</span><span class="amt">${m$(x.a)}</span></div>`).join('')
    : '<div class="tacct-row empty">—</div>';
  let html = '';
  order.forEach((tp) => {
    const keys = Object.keys(ACCOUNTS).filter((k) => ACCOUNTS[k].type === tp && (dr[k].length || cr[k].length));
    if (!keys.length) return;
    html += `<div class="books-section-title">${titles[tp]}</div>`;
    keys.forEach((k) => {
      const a = ACCOUNTS[k];
      const drTot = dr[k].reduce((s, x) => s + x.a, 0);
      const crTot = cr[k].reduce((s, x) => s + x.a, 0);
      const net = drTot - crTot;
      const normalDebit = (tp === 'asset' || tp === 'expense');
      const balSide = net >= 0 ? 'debit' : 'credit';
      html += `<div class="tacct">
        <div class="tacct-name">${a.name}<span class="tacct-meta">${cap(tp)} · normal ${normalDebit ? 'Dr' : 'Cr'}</span></div>
        <div class="tacct-grid">
          <div class="tacct-side"><div class="tacct-h">Debits</div>${rowsHtml(dr[k])}<div class="tacct-total"><span>total</span><span class="amt">${m$(drTot)}</span></div></div>
          <div class="tacct-side right"><div class="tacct-h">Credits</div>${rowsHtml(cr[k])}<div class="tacct-total"><span>total</span><span class="amt">${m$(crTot)}</span></div></div>
        </div>
        <div class="tacct-bal ${balSide}">Balance ${m$(Math.abs(net))} (${balSide})</div>
      </div>`;
    });
  });
  return html || '<div style="color:#7f93ac;">No ledger activity yet.</div>';
}

function renderBooksPanel() {
  const modalEl = document.getElementById('modal');
